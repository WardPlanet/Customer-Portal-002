        var textType = ['paragraph', 'header', 'note', 'warning'].filter(function (type) {
          return sections[prefix + type.toUpperCase()];
        })[0];
        if (headerLevel) {
          blocks.push({ type: 'header', level: headerLevel, text: body(prefix + 'HEADER ' + headerLevel) });
        } else if (textType) {
          blocks.push({ type: textType, text: body(prefix + textType.toUpperCase()) });
        } else {
          blocks.push({
            type: 'step',
            number: parseInt(body(prefix + 'STEP NUMBER'), 10),
            title: body(prefix + 'STEP TITLE'),
            text: body(prefix + 'STEP TEXT')
          });
        }
      });

      if (!ordered.length) {
        var legacySteps = {};
        Object.keys(sections).forEach(function (name) {
          var match = /^STEP (\d+) (TITLE|TEXT)$/.exec(name);
          if (match) { legacySteps[Number(match[1])] = true; }
        });
        Object.keys(legacySteps).map(Number).sort(function (a, b) { return a - b; }).forEach(function (n) {
          blocks.push({ type: 'step', title: body('STEP ' + n + ' TITLE'), text: body('STEP ' + n + ' TEXT') });
        });
      }

      // A step starts a new section when it is numbered 1, or when it does not follow another step
      blocks.forEach(function (block, index) {
        if (block.type !== 'step') { return; }
        var previous = blocks[index - 1];
        var followsStep = !!previous && previous.type === 'step';
        block.continues = followsStep && (isNaN(block.number) || block.number > 1);
      });

      return blocks;
    }

    function applyDraft(sections) {
      function body(name) { return sections[name] ? sections[name].join(NL).trim() : ''; }
      function list(name) {
        return sections[name] ? sections[name].map(function (l) { return l.trim(); }).filter(Boolean) : [];
      }

      titleEl.textContent = body('TITLE');
      subtitleEl.textContent = body('SUBTITLE');
      summaryEl.innerHTML = markdownToHtml(body('SUMMARY'));

      var blocks = readDraftBlocks(sections, body);
      var aboveButton = parseInt(body('ADD BLOCK BUTTON'), 10);
      layoutContent(blocks, isNaN(aboveButton) ? blocks.length : aboveButton);
      clearSuggestions();
      resetRichSelection();

      var pageType = body('PAGE TYPE');
      state.pageTypes = BASE_PAGE_TYPES.slice();
      if (pageType && state.pageTypes.indexOf(pageType) < 0) { state.pageTypes.push(pageType); }
      state.pageType = pageType;

      var selected = list('WHERE THIS LIVES');
      state.locations = BASE_LOCATIONS.map(function (name) {
        return { name: name, on: selected.indexOf(name) >= 0 };
      });
      selected.forEach(function (name) {
        if (BASE_LOCATIONS.indexOf(name) < 0) { state.locations.push({ name: name, on: true }); }
      });

      state.members = list('LINKED TEAM MEMBERS');
      var reviewer = body('REVIEWER');
      if (reviewer && state.members.indexOf(reviewer) < 0) { state.members.push(reviewer); }
      state.reviewer = reviewer;

      state.visibility = body('VISIBILITY') === 'Client-Safe' ? 'Client-Safe' : 'Internal-Only';
      state.keywords = list('KEYWORDS').slice(0, 20);

      renderSidebar();
      refreshOutline();
    }

    function loadDraftText(text) {
      var sections = parseDraft(text);
      if (!looksLikeDraft(sections)) { return false; }
      applyDraft(sections);
      setStatus('Draft opened', true);
      showNotice('Draft opened. Every section has been filled in.');
      return true;
    }

    /* ---------- Dialog (paste in / copy out fallback) ---------- */
    var dialog = byId('draft-dialog');
    var dialogText = byId('draft-dialog-text');
    var dialogHint = byId('draft-dialog-hint');

    function openDialog(text, hint) {
      dialogText.value = text;
      dialogHint.textContent = hint;
      dialog.showModal();
      dialogText.focus();
    }

    /* ---------- Save draft ---------- */
    function getDownloads() {
      if (!window.claude || typeof window.claude.use !== 'function') { return Promise.resolve(null); }
      return window.claude.use('downloads').catch(function () { return null; });
    }

    async function saveDraft() {
      var missing = validateRequired();
      if (missing.length) {
        showNotice('Can\u2019t save yet. Still needed: ' + missing.map(function (item) { return item.label; }).join(', ') + '.');
        missing[0].target.focus();
        return;
      }

      // Search keywords are refreshed from the page text every time a draft is saved
      await refreshKeywords();

      var text = serializeDraft();
      var filename = draftFilename();
      var fallbackHint = 'Downloads aren\u2019t available here. Copy this text into a .txt file, then use "Paste draft text" to load it later.';

      getDownloads().then(function (downloads) {
        if (!downloads) {
          openDialog(text, fallbackHint);
          return;
        }
        return downloads.save({ filename: filename, data: text }).then(
          function () {
            setStatus('Saved just now', true);
            showNotice('Draft saved as ' + filename + '.');
          },
          function (error) {
            if (error && error.code === 'declined') { return; }
            openDialog(text, fallbackHint);
          }
        );
      });
    }

    /* ---------- Rich text (paragraph blocks only) ----------
       Formatted text is stored in the draft file as plain text:
         **bold**   _italic_   <u>underline</u>   [label](https://example.com)
         - bullet item     1. numbered item
       A backslash in front of a symbol keeps that symbol literal. */
    var BACKSLASH = String.fromCharCode(92);
    var MARKDOWN_SPECIALS = BACKSLASH + '*_[]<>';
    var TOKEN_OPEN = String.fromCharCode(0xE000);
    var TOKEN_CLOSE = String.fromCharCode(0xE001);

    function escapeHtml(text) {
      return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function escapeMarkdown(text) {
      return text.split(String.fromCharCode(160)).join(' ').split('').map(function (ch) {
        return MARKDOWN_SPECIALS.indexOf(ch) >= 0 ? BACKSLASH + ch : ch;
      }).join('');
    }

    function isListLookalike(line) {
      return /^- /.test(line) || /^[0-9]+[.] /.test(line);
    }

    // One inline node (text, bold, italic, underline, link) -> formatted plain text
    function inlineToMarkdown(node) {
      if (node.nodeType === 3) { return escapeMarkdown(node.nodeValue); }
      if (node.nodeType !== 1) { return ''; }
      if (node.tagName === 'BR') { return NL; }

      var inner = Array.prototype.map.call(node.childNodes, inlineToMarkdown).join('');
      var tag = node.tagName;
      if (tag === 'B' || tag === 'STRONG') { return inner ? '**' + inner + '**' : ''; }
      if (tag === 'I' || tag === 'EM') { return inner ? '_' + inner + '_' : ''; }
      if (tag === 'U') { return inner ? '<u>' + inner + '</u>' : ''; }
      if (tag === 'A' && node.getAttribute('href') && node.textContent) {
        var href = node.getAttribute('href').split(' ').join('%20').split(')').join('%29');
        return '[' + escapeMarkdown(node.textContent) + '](' + href + ')';
      }
      return inner;
    }

    // A paragraph field's HTML -> formatted plain text, one line per line break or list item
    function htmlToMarkdown(root) {
      var lines = [];
      var current = '';

      function flush() {
        lines.push(isListLookalike(current) ? BACKSLASH + current : current);
        current = '';
      }

      function walk(node) {
        if (node.nodeType !== 1) { current += inlineToMarkdown(node); return; }
        var tag = node.tagName;
        if (tag === 'BR') {
          flush();
        } else if (tag === 'UL' || tag === 'OL') {
          if (current !== '') { flush(); }
          Array.prototype.forEach.call(node.children, function (item, index) {
            lines.push((tag === 'UL' ? '- ' : (index + 1) + '. ') + inlineToMarkdown(item).split(NL).join(' '));
          });
        } else if (tag === 'DIV' || tag === 'P') {
          if (current !== '') { flush(); }
          Array.prototype.forEach.call(node.childNodes, walk);
          if (current !== '') { flush(); }
        } else {
          current += inlineToMarkdown(node);
        }
      }

      Array.prototype.forEach.call(root.childNodes, walk);
      if (current !== '') { flush(); }
      return lines.join(NL);
    }

    // One line of formatted plain text -> HTML
    function inlineMarkdownToHtml(text) {
      var stash = [];
      function keep(html) {
        stash.push(html);
        return TOKEN_OPEN + (stash.length - 1) + TOKEN_CLOSE;
      }

      // Escaped symbols stay literal
      var work = '';
      for (var i = 0; i < text.length; i += 1) {
        var following = text.charAt(i + 1);
        if (text.charAt(i) === BACKSLASH && following && MARKDOWN_SPECIALS.indexOf(following) >= 0) {
          work += keep(escapeHtml(following));
          i += 1;
        } else {
          work += text.charAt(i);
        }
      }

      work = escapeHtml(work);
      work = work.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (match, label, url) {
        if (!/^(https?:[/][/]|mailto:)/i.test(url)) { return match; }
        return keep('<a href="' + url + '">' + label + '</a>');
      });
      work = work.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
      work = work.replace(/_(.+?)_/g, '<i>$1</i>');
      work = work.replace(/&lt;u&gt;(.+?)&lt;[/]u&gt;/g, '<u>$1</u>');

      var tokenPattern = new RegExp(TOKEN_OPEN + '([0-9]+)' + TOKEN_CLOSE, 'g');
      for (var pass = 0; pass < 3; pass += 1) {
        work = work.replace(tokenPattern, function (match, index) { return stash[Number(index)]; });
      }
      return work;
    }

    // Formatted plain text -> a paragraph field's HTML
    function markdownToHtml(markdown) {
      if (!markdown) { return ''; }
      var html = '';
      var openList = '';
      var needsBreak = false;

      markdown.split(NL).forEach(function (line) {
        var bullet = /^- (.*)$/.exec(line);
        var numbered = /^[0-9]+[.] (.*)$/.exec(line);
        var listTag = bullet ? 'ul' : (numbered ? 'ol' : '');

        if (openList && openList !== listTag) {
          html += '</' + openList + '>';
          openList = '';
        }
        if (listTag) {
          if (!openList) {
            html += '<' + listTag + '>';
            openList = listTag;
          }
          html += '<li>' + inlineMarkdownToHtml((bullet || numbered)[1]) + '</li>';
          needsBreak = false;
          return;
        }

        var text = line;
        var rest = line.slice(1);
        if (line.charAt(0) === BACKSLASH && isListLookalike(rest)) { text = rest; }
        if (needsBreak) { html += '<br>'; }
        html += inlineMarkdownToHtml(text);
        needsBreak = true;
      });

      if (openList) { html += '</' + openList + '>'; }
      return html;
    }

    /* ---------- Formatting toolbar: works only inside paragraph fields ---------- */
    var activeRich = null;   // the paragraph field the cursor is in
    var savedRange = null;   // its last selection, so a toolbar click can restore it
    var formatButtons = Array.prototype.slice.call(document.querySelectorAll('.icon-btn[data-format]'));
    var linkPopover = byId('link-popover');
    var linkInput = byId('link-input');

    function updateFormatButtons() {
      formatButtons.forEach(function (button) {
        var format = button.getAttribute('data-format');
        var pressed = false;
        if (activeRich && format !== 'link') {
          try { pressed = document.queryCommandState(format); } catch (error) { pressed = false; }
        }
        button.setAttribute('aria-disabled', String(!activeRich));
        button.setAttribute('aria-pressed', String(pressed));
      });
    }

    function resetRichSelection() {
      activeRich = null;
      savedRange = null;
      linkPopover.hidden = true;
      updateFormatButtons();
    }

    function restoreSelection() {
      if (!activeRich) { return; }
      var selection = window.getSelection();
      var cursorIsInField = document.activeElement === activeRich && selection.rangeCount && activeRich.contains(selection.anchorNode);
      if (cursorIsInField) { return; }   // leave the live cursor alone

      activeRich.focus();
      if (savedRange) {
        selection.removeAllRanges();
        selection.addRange(savedRange.cloneRange());
      }
    }

    function currentAnchor() {
      var node = savedRange ? savedRange.startContainer : null;
      while (node && node !== activeRich) {
        if (node.nodeType === 1 && node.tagName === 'A') { return node; }
        node = node.parentNode;
      }
      return null;
    }

    // The cursor's position as a count of characters from the start of the field. A command can
    // replace the text nodes, so the count (not a node reference) is what survives it.
    function caretTextOffset(field, selection) {
      var range = document.createRange();
      range.selectNodeContents(field);
      range.setEnd(selection.anchorNode, selection.anchorOffset);
      return range.toString().length;
    }

    function placeCaretAtTextOffset(field, offset) {
      var walker = document.createTreeWalker(field, NodeFilter.SHOW_TEXT);
      var remaining = offset;
      var node = walker.nextNode();
      while (node) {
        if (remaining <= node.nodeValue.length) {
          var range = document.createRange();
          range.setStart(node, remaining);
          range.collapse(true);
          var selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
          return;
        }
        remaining -= node.nodeValue.length;
        node = walker.nextNode();
      }
    }

    function normalizeUrl(value) {
      var url = value.trim();
      if (!url) { return ''; }
      if (/^(https?:[/][/]|mailto:)/i.test(url)) { return url; }
      if (/^[a-z][a-z0-9+.-]*:/i.test(url)) { return ''; }
      return 'https://' + url;
    }

    function openLinkPopover(opener) {
      var rect = opener.getBoundingClientRect();
      var anchor = currentAnchor();
      linkInput.value = anchor ? anchor.getAttribute('href') : '';
      linkPopover.hidden = false;
      var width = linkPopover.offsetWidth;
      linkPopover.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - width - 8)) + 'px';
      linkPopover.style.top = (rect.bottom + 8) + 'px';
      linkInput.focus();
      linkInput.select();
    }

    function closeLinkPopover() {
      linkPopover.hidden = true;
      restoreSelection();
    }

    function applyLink() {
      var typed = linkInput.value.trim();
      var url = normalizeUrl(typed);
      if (typed && !url) {
        showNotice('Links can start with https://, http:// or mailto:.');
        return;
      }

      var anchor = currentAnchor();
      linkPopover.hidden = true;
      restoreSelection();
      if (!url) {
        document.execCommand('unlink');
      } else if (anchor) {
        anchor.setAttribute('href', url);
        markDirty();
      } else if (savedRange && savedRange.collapsed) {
        document.execCommand('insertHTML', false, '<a href="' + escapeHtml(url) + '">' + escapeHtml(url) + '</a>');
      } else {
        document.execCommand('createLink', false, url);
      }
      updateFormatButtons();
    }

    formatButtons.forEach(function (button) {
      // Keep the text selection while the toolbar is clicked
      button.addEventListener('mousedown', function (event) { event.preventDefault(); });
      button.addEventListener('click', function () {
        if (!activeRich) {
          showNotice('Formatting works in paragraph text only: the opening paragraph and Text blocks.');
          return;
        }
        var format = button.getAttribute('data-format');
        if (format === 'link') { openLinkPopover(button); return; }
        restoreSelection();
        var selection = window.getSelection();
        var isListFormat = format.indexOf('List') >= 0;
        // Only needed when the cursor sits in text; on an empty line the browser puts it in the right place
        var caretOffset = isListFormat && selection.rangeCount && selection.isCollapsed && selection.anchorNode.nodeType === 3 && activeRich.contains(selection.anchorNode)
          ? caretTextOffset(activeRich, selection)
          : -1;

        document.execCommand(format, false, null);

        // Browsers can drop the cursor to the start of the line after a list command; put it back
        if (caretOffset >= 0) { placeCaretAtTextOffset(activeRich, caretOffset); }
        updateFormatButtons();
      });
    });

    byId('link-apply').addEventListener('click', applyLink);
    byId('link-cancel').addEventListener('click', closeLinkPopover);
    linkInput.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') { event.preventDefault(); applyLink(); }
      if (event.key === 'Escape') { event.preventDefault(); closeLinkPopover(); }
    });
    document.addEventListener('click', function (event) {
      var onLinkControls = event.target.closest('#link-popover, .icon-btn[data-format="link"]');
      if (!linkPopover.hidden && !onLinkControls) { linkPopover.hidden = true; }
    });

    // Track which field has the cursor; only paragraph fields turn the toolbar on
    document.addEventListener('focusin', function (event) {
      var target = event.target;
      if (!target.closest || target.closest('.icon-btn[data-format], #link-popover')) { return; }
      activeRich = target.closest('[data-rich]');
      updateFormatButtons();
    });
    document.addEventListener('selectionchange', function () {
      var selection = window.getSelection();
      if (activeRich && selection.rangeCount && activeRich.contains(selection.anchorNode)) {
        savedRange = selection.getRangeAt(0).cloneRange();
        updateFormatButtons();
      }
    });

    // Bold / italic / underline keyboard shortcuts work in paragraph fields only
    document.addEventListener('keydown', function (event) {
      var target = event.target;
      var isFormatShortcut = (event.ctrlKey || event.metaKey) && /^[biu]$/i.test(event.key);
      if (isFormatShortcut && target.closest && target.closest('[contenteditable]') && !target.closest('[data-rich]')) {
        event.preventDefault();
      }
    });

    updateFormatButtons();

    /* ---------- AI assist: scan the page and suggest changes ---------- */
    var AI_MAX_SUGGESTIONS = 8;
    var aiButton = byId('ai-assist');
    var aiController = null;     // set while a scan runs, so a second click can cancel it
    var aiUnavailable = false;   // set when this view cannot use Claude at all

    function getSample() {
      if (!window.claude || typeof window.claude.use !== 'function') { return Promise.resolve(null); }
      return window.claude.use('sample').catch(function () { return null; });
    }

    // The whole page as plain text, with each section labelled so a suggestion can point at it
    function describePageForAi() {
      var lines = [
        'Page type: ' + (state.pageType || 'not chosen'),
        'Visibility: ' + state.visibility,
        '',
        '[title] ' + readText(titleEl),
        '[description] ' + readText(subtitleEl),
        '[summary] ' + readText(summaryEl)
      ];
      readBlocks().forEach(function (block, index) {
        var label = 'block ' + (index + 1) + ', ' + block.type;
        if (block.type === 'step') {
          lines.push('[' + label + ', numbered ' + block.number + '] title: ' + block.title + ' | text: ' + block.text);
        } else if (block.type === 'header') {
          lines.push('[' + label + ', level ' + block.level + '] ' + block.text);
        } else {
          lines.push('[' + label + '] ' + block.text);
        }
      });
      return lines.join(NL);
    }

    function buildAiPrompt() {
      return [
        'You are an editor reviewing a draft process-documentation page. Read it and suggest improvements.',
        '',
        'Rules:',
        '- Suggest at most ' + AI_MAX_SUGGESTIONS + ' changes, and only ones that clearly help a reader follow the process: unclear or ambiguous wording, missing detail, typos and tone. Only rewrite what is already on the page; never add new sections.',
        '- Do not invent facts, numbers, names, systems or policies that are not on the page. If a rewrite would need a fact only the author knows, keep the original wording for that part instead of guessing.',
        '- If Visibility is Client-Safe, also flag wording that only makes sense for internal staff.',
        '- Keep the author\u2019s voice and keep edits short.',
        '',
        'Reply with ONLY a JSON array (no other text). Each item is an object:',
        '{"target": "title" | "description" | "summary" | "block N", "title": "...", "text": "...", "reason": "..."}',
        '- target: which section the suggestion belongs to. N is the block number shown below.',
        '- "text" is the full replacement for that section\u2019s text. For a step block you may also give a replacement "title". Leave out anything you would not change.',
        '- title and description are single plain-text lines. A summary or paragraph may use **bold**, _italic_, lines starting with "- " for bullets and "1. " for numbers.',
        '- reason: under 120 characters, why the change helps.',
        '- If nothing needs changing, reply with [].',
        '',
        'The page:',
        describePageForAi()
      ].join(NL);
    }

    function oneLine(value, limit) {
      return typeof value === 'string' ? value.split(NL).join(' ').trim().slice(0, limit) : '';
    }

    // Checks one item from the reply; returns a clean suggestion or null
    function cleanSuggestion(item) {
      if (!item || typeof item !== 'object') { return null; }
      var target = String(item.target || '').toLowerCase().trim();
      var isPageField = target === 'title' || target === 'description' || target === 'summary';
      if (!isPageField && !/^block [0-9]+$/.test(target)) { return null; }

      if (item.action === 'add') { return null; }   // suggestions only replace text that is already there
      var text = typeof item.text === 'string' ? item.text.trim().slice(0, 2000) : '';
      var title = oneLine(item.title, 200);
      if (isPageField && !text) { text = title; title = ''; }
      if (!text && !title) { return null; }
      if (target === 'title' || target === 'description') { text = oneLine(text, 300); }

      return {
        target: target,
        title: title,
        text: text,
        reason: oneLine(item.reason, 160)
      };
    }

    function suggestionHost(target, blocks) {
      if (target === 'title') { return titleEl.closest('.text-block'); }
      if (target === 'description') { return subtitleEl.closest('.text-block'); }
      if (target === 'summary') { return summaryEl.closest('.text-block'); }
      return blocks[Number(target.split(' ')[1]) - 1] || null;
    }

    // An edit that would leave the section exactly as it is is not worth showing
    function changesNothing(suggestion, host) {
      if (host.classList.contains('step-block')) {
        var sameTitle = !suggestion.title || suggestion.title === readText(host.querySelector('.step-title'));
        var sameText = !suggestion.text || suggestion.text === readText(host.querySelector('.step-text'));
        return sameTitle && sameText;
      }
      return suggestion.text === readText(host.querySelector('[contenteditable]'));
    }

    function setFieldText(field, text) {
      if (field.hasAttribute('data-rich')) {
        field.innerHTML = markdownToHtml(text);
      } else {
        field.textContent = field.hasAttribute('data-single-line') ? text.split(NL).join(' ') : text;
      }
    }

    // Accepting a suggestion (+) replaces the section's existing text with the suggested text
    function applySuggestion(suggestion, host) {
      if (host.classList.contains('step-block')) {
        if (suggestion.title) { setFieldText(host.querySelector('.step-title'), suggestion.title); }
        if (suggestion.text) { setFieldText(host.querySelector('.step-text'), suggestion.text); }
      } else {
        setFieldText(host.querySelector('[contenteditable]'), suggestion.text);
      }
      markDirty();
      refreshOutline();
    }

    // The small card shown next to a section: the proposal, a + to accept it and an x to dismiss it
    function buildSuggestionPanel(suggestion, host) {
      var panel = document.createElement('div');
      panel.className = 'ai-suggestion';
      panel.setAttribute('role', 'group');
      panel.setAttribute('aria-label', 'AI suggestion');

      var body = document.createElement('div');
      body.className = 'ai-suggestion-body';

      var label = document.createElement('div');
      label.className = 'ai-suggestion-label';
      label.textContent = 'Suggested replacement';
      body.appendChild(label);

      if (suggestion.reason) {
        var reason = document.createElement('p');
        reason.className = 'ai-suggestion-reason';
        reason.textContent = suggestion.reason;
        body.appendChild(reason);
      }

      var preview = document.createElement('div');
      preview.className = 'ai-suggestion-text';
      var isRichPreview = !!host.querySelector('[data-rich]');
      if (isRichPreview) {
        preview.innerHTML = markdownToHtml(suggestion.text);
      } else {
        preview.textContent = [suggestion.title, suggestion.text].filter(Boolean).join(NL);
      }
      body.appendChild(preview);

      var actions = document.createElement('div');
      actions.className = 'ai-suggestion-actions';

      var accept = document.createElement('button');
      accept.type = 'button';
      accept.className = 'ai-accept';
      accept.setAttribute('aria-label', 'Replace the existing text with this suggestion');
      accept.title = 'Replace the existing text with this suggestion';
      accept.innerHTML = PLUS_ICON;
      accept.addEventListener('click', function () {
        applySuggestion(suggestion, host);
        panel.remove();
      });

      var dismiss = document.createElement('button');
      dismiss.type = 'button';
      dismiss.className = 'ai-dismiss';
      dismiss.setAttribute('aria-label', 'Dismiss this suggestion');
      dismiss.title = 'Dismiss this suggestion';
      dismiss.innerHTML = CLOSE_ICON;
      dismiss.addEventListener('click', function () { panel.remove(); });

      actions.appendChild(accept);
      actions.appendChild(dismiss);
      panel.appendChild(body);
      panel.appendChild(actions);
      return panel;
    }

    function clearSuggestions() {
      document.querySelectorAll('.ai-suggestion').forEach(function (panel) { panel.remove(); });
    }

    // Shows one suggestion card inside its section, replacing any card that section already has
    function attachSuggestion(suggestion, host) {
      // Steps lay their content out in a row, so the card goes inside the step's text column
      var container = host.classList.contains('step-block') ? host.querySelector(':scope > div') : host;
      container.querySelectorAll(':scope > .ai-suggestion').forEach(function (panel) { panel.remove(); });
      container.appendChild(buildSuggestionPanel(suggestion, host));
    }

    // Puts each suggestion next to its section; returns how many were shown
    function showSuggestions(result) {
      var list = Array.isArray(result) ? result.slice(0, AI_MAX_SUGGESTIONS) : [];
      var blocks = contentBlocks();
      var shown = 0;

      list.forEach(function (item) {
        var suggestion = cleanSuggestion(item);
        var host = suggestion ? suggestionHost(suggestion.target, blocks) : null;
        if (!host || changesNothing(suggestion, host)) { return; }

        attachSuggestion(suggestion, host);
        shown += 1;
      });
      return shown;
    }

    function setAiBusy(busy) {
      aiButton.classList.toggle('is-busy', busy);
      aiButton.querySelector('.ai-label').textContent = busy ? 'Scanning\u2026 (click to cancel)' : 'AI assist';
    }

    function handleAiError(error) {
      var code = error && error.code;
      if (code === 'cancelled') {
        showNotice('AI scan cancelled.');
      } else if (code === 'not_granted' || code === 'sampling_disabled' || code === 'not_declared' || code === 'capability_disabled' || code === 'capability_removed') {
        aiUnavailable = true;
        updateSaveState();
        showNotice('AI assist isn\u2019t available: this page wasn\u2019t allowed to use Claude.');
      } else if (code === 'rate_limited') {
        showNotice('AI assist has been used a lot just now. Try again in a little while.');
      } else if (code === 'invalid_json' || code === 'empty_completion' || code === 'refused') {
        showNotice('AI assist couldn\u2019t come up with suggestions this time. Try again.');
      } else {
        showNotice('AI assist ran into a problem. Try again.');
      }
    }

    async function runAiAssist() {
      if (aiController) { aiController.abort(); return; }   // a click while scanning cancels
      if (aiUnavailable) {
        showNotice('AI assist isn\u2019t available in this view.');
        return;
      }
      if (!isDraftComplete()) {
        validateRequired();
        showNotice('Fill in the required fields (*) before using AI assist.');
        return;
      }

      aiController = new AbortController();
      var controller = aiController;
      setAiBusy(true);
      try {
        var sample = await getSample();
        if (!sample) {
          aiUnavailable = true;
          updateSaveState();
          showNotice('AI assist isn\u2019t available in this view.');
          return;
        }
        clearSuggestions();
        var result = await sample.json(buildAiPrompt(), { modelTier: 'default', signal: controller.signal });
        var count = showSuggestions(result);
        showNotice(count
          ? 'AI assist has ' + count + (count === 1 ? ' suggestion' : ' suggestions') + '. Use + to replace the existing text or x to dismiss it.'
          : 'AI assist found nothing to change. This page reads well.');
      } catch (error) {
        handleAiError(error);
      } finally {
        aiController = null;
        setAiBusy(false);
      }
    }

    /* ---------- Search keywords: AI writes 10 whenever a draft is saved ----------
       They are stored only in the saved file's [KEYWORDS] section, for the search function.
       They are never shown in the editor or on the page itself. */
    var KEYWORD_COUNT = 10;
    var isMakingKeywords = false;

    function buildKeywordPrompt() {
      return [
        'Write exactly ' + KEYWORD_COUNT + ' search keywords for this process-documentation page. People will type these words into a search box to find the page.',
        '',
        'Rules:',
        '- Use lowercase single words or short two- or three-word phrases.',
        '- Mix the main topic, the tools and systems the page names, the team or role involved, and terms people might search for even if the page does not use those exact words.',
        '- No duplicates, no sentences, and nothing that is not about this page.',
        '',
        'Reply with ONLY a JSON array of ' + KEYWORD_COUNT + ' strings.',
        '',
        'The page:',
        describePageForAi()
      ].join(NL);
    }

    // Tidies the reply: trimmed, lowercase, one line each, no repeats, at most 10
    function cleanKeywords(result) {
      var list = Array.isArray(result) ? result : [];
      var seen = {};
      var keywords = [];
      list.forEach(function (item) {
        var keyword = oneLine(typeof item === 'string' ? item : '', 40).toLowerCase();
        if (keyword && !seen[keyword] && keywords.length < KEYWORD_COUNT) {
          seen[keyword] = true;
          keywords.push(keyword);
        }
      });
      return keywords;
    }

    // Saving never waits on AI forever or fails because of it: without AI the draft saves with the
    // keywords it already had.
    async function refreshKeywords() {
      if (isMakingKeywords || aiUnavailable) { return; }
      isMakingKeywords = true;
      try {
        var sample = await getSample();
        if (!sample) { return; }
        showNotice('Preparing your draft\u2026');
        var keywords = cleanKeywords(await sample.json(buildKeywordPrompt(), { modelTier: 'quick' }));
        if (keywords.length) {
          state.keywords = keywords;
        }
      } catch (error) {
        var code = error && error.code;
        if (code === 'not_granted' || code === 'sampling_disabled' || code === 'not_declared' || code === 'capability_disabled' || code === 'capability_removed') {
          aiUnavailable = true;
          updateSaveState();
        }
      } finally {
        isMakingKeywords = false;
      }
    }

    /* ---------- AI assist for a single section ---------- */
    // Every section that has text gets a small sparkle button in its corner. It asks Claude to
    // improve just that section and shows the answer as a + / x suggestion card.
    var SPARKLE_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15z"/></svg>';

    function allSections() {
      return [titleEl.closest('.text-block'), subtitleEl.closest('.text-block'), summaryEl.closest('.text-block')].concat(contentBlocks());
    }

    function isSectionFilled(host) {
      if (host.classList.contains('step-block')) {
        return readText(host.querySelector('.step-title')) !== '' || readText(host.querySelector('.step-text')) !== '';
      }
      return readText(host.querySelector('[contenteditable]')) !== '';
    }

    // The name used for a section in the prompt: title, description, summary, or "block N"
    function targetNameFor(host) {
      if (host === titleEl.closest('.text-block')) { return 'title'; }
      if (host === subtitleEl.closest('.text-block')) { return 'description'; }
      if (host === summaryEl.closest('.text-block')) { return 'summary'; }
      return 'block ' + (contentBlocks().indexOf(host) + 1);
    }

    function buildSectionPrompt(target) {
      return [
        'You are an editor improving ONE section of a draft process-documentation page. Rewrite just that section so it is clearer and easier to follow.',
        '',
        'Rules:',
        '- Keep the meaning and the author\u2019s voice, and keep it short. Fix typos and unclear wording. Add detail only when the rest of the page already supports it.',
        '- Do not invent facts, numbers, names, systems or policies that are not on the page. If the rewrite would need a fact only the author knows, keep the original wording for that part.',
        '- If Visibility is Client-Safe, avoid wording that only makes sense for internal staff.',
        '- A title or description is a single plain-text line. A summary or text block may use **bold**, _italic_, lines starting with "- " for bullets and "1. " for numbers.',
        '',
        'Reply with ONLY a JSON object: {"text": "the full rewritten text", "reason": "under 120 characters, why it is better"}. For a step you may also include "title" (the rewritten step title). If nothing needs changing, reply with {}.',
        '',
        'Section to improve: ' + target,
        '',
        'The whole page, for context:',
        describePageForAi()
      ].join(NL);
    }

    async function runSectionAssist(host, button) {
      if (aiController) {
        showNotice('AI assist is already working on something. Try again in a moment.');
        return;
      }
      if (aiUnavailable) {
        showNotice('AI assist isn\u2019t available in this view.');
        return;
      }

      aiController = new AbortController();
      var controller = aiController;
      button.classList.add('is-busy');
      try {
        var sample = await getSample();
        if (!sample) {
          aiUnavailable = true;
          updateSaveState();
          showNotice('AI assist isn\u2019t available in this view.');
          return;
        }
        var target = targetNameFor(host);
        var result = await sample.json(buildSectionPrompt(target), { modelTier: 'default', signal: controller.signal });
        var item = Array.isArray(result) ? result[0] : result;
        var suggestion = item && typeof item === 'object' ? cleanSuggestion(Object.assign({}, item, { target: target, action: 'edit' })) : null;

        if (!suggestion || !host.isConnected || changesNothing(suggestion, host)) {
          showNotice('AI assist found nothing to improve in this section.');
          return;
        }
        attachSuggestion(suggestion, host);
        showNotice('AI assist has a suggestion for this section. Use + to replace the text or x to dismiss it.');
      } catch (error) {
        handleAiError(error);
      } finally {
        aiController = null;
        button.classList.remove('is-busy');
      }
    }

    function createSectionAiButton(host) {
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'section-ai';
      button.setAttribute('aria-label', 'AI assist for this section');
      button.title = 'AI assist: suggest an improvement for this section';
      button.innerHTML = SPARKLE_ICON;
      button.addEventListener('click', function () {
        if (button.getAttribute('aria-disabled') === 'true') {
          showNotice('Add some text to this section first, then AI assist can improve it.');
          return;
        }
        runSectionAssist(host, button);
      });
      return button;
    }

    // Called after every change: every section always shows the button, but it only works once the
    // section has text
    function ensureSectionAiButtons() {
      allSections().forEach(function (host) {
        var button = host.querySelector(':scope > .section-ai');
        if (!button) {
          button = createSectionAiButton(host);
          host.appendChild(button);
        }
        var hasText = isSectionFilled(host);
        button.setAttribute('aria-disabled', String(!hasText));
        button.title = hasText ? 'AI assist: suggest an improvement for this section' : 'Add some text to use AI assist on this section';
      });
    }

    aiButton.addEventListener('click', runAiAssist);

    /* ---------- Wire up events ---------- */
    byId('save-draft').addEventListener('click', saveDraft);

    // Submit has no action yet; if the page is incomplete it points at what's missing
    byId('submit-draft').addEventListener('click', function () {
      var missing = validateRequired();
      if (missing.length) {
        showNotice('Fill in the required fields marked * before submitting.');
        missing[0].target.focus();
      }
    });

    byId('open-draft').addEventListener('click', function () { byId('draft-file').click(); });
    byId('draft-file').addEventListener('change', function (event) {
      var input = event.target;
      var file = input.files && input.files[0];
      if (!file) { return; }
      file.text().then(function (text) {
        if (!loadDraftText(text)) {
          showNotice('Couldn\u2019t read that file. It doesn\u2019t look like a saved draft.');
        }
        input.value = '';
      });
    });

    byId('paste-draft').addEventListener('click', function () {
      openDialog('', 'Paste the full text of a saved draft, then choose Load into editor.');
    });
    byId('draft-dialog-close').addEventListener('click', function () { dialog.close(); });
    byId('draft-dialog-load').addEventListener('click', function () {
      if (loadDraftText(dialogText.value)) {
        dialog.close();
      } else {
        dialogHint.textContent = 'That text doesn\u2019t look like a saved draft. Check that it includes the [TITLE] and other section headings.';
      }
    });

    // Typing in any editable block
    document.addEventListener('input', function (event) {
      var target = event.target;
      if (!target.matches || !target.matches('[contenteditable]')) { return; }
      if (target.textContent === '' && !target.querySelector('ul, ol')) { target.innerHTML = ''; }
      var flagged = target.closest('.has-error');
      if (flagged) { clearBlockError(flagged); }
      refreshOutline();
      markDirty();
    });

    // Keep titles on one line
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' && event.target.closest && event.target.closest('[data-single-line]')) {
        event.preventDefault();
      }
    });

    // Paste as plain text only
    document.addEventListener('paste', function (event) {
      var target = event.target;
      var editable = target.closest && target.closest('[contenteditable]');
      if (!editable) { return; }
      event.preventDefault();
      var text = (event.clipboardData || window.clipboardData).getData('text/plain');
      if (editable.hasAttribute('data-single-line')) { text = text.replace(/\s*\r?\n\s*/g, ' '); }
      document.execCommand('insertText', false, text);
    });

    /* ---------- Add-block menu (Paragraph / Header / Steps) ---------- */
    var blockMenu = byId('block-menu');
    var menuOpener = null;
    var menuGetInsertBefore = null;
    var menuInserterTypes = null;

    function closeBlockMenu() {
      blockMenu.hidden = true;
    }

    // Places the menu under the button that opened it (or above it when there is no room below)
    function positionBlockMenu() {
      var rect = menuOpener.getBoundingClientRect();
      var menuWidth = blockMenu.offsetWidth;
      var menuHeight = blockMenu.offsetHeight;
      var left = rect.left + rect.width / 2 - menuWidth / 2;
      left = Math.max(8, Math.min(left, window.innerWidth - menuWidth - 8));
      var top = rect.bottom + 8;
      if (top + menuHeight > window.innerHeight - 8) { top = Math.max(8, rect.top - menuHeight - 8); }
      blockMenu.style.left = left + 'px';
      blockMenu.style.top = top + 'px';
    }

    function focusFirstMenuItem() {
      var first = blockMenu.querySelector('.menu-panel:not([hidden]) button:not([hidden])');
      if (first) { first.focus(); }
    }

    // The menu has two panels: the block types ('main') and the header levels ('headers')
    // Levels deeper than the hierarchy allows at the insertion point are greyed out
    function updateHeaderLevelButtons() {
      var beforeNode = menuGetInsertBefore ? menuGetInsertBefore() : null;
      var deepest = deepestAllowedHeaderLevel(beforeNode);
      blockMenu.querySelectorAll('#menu-headers [data-level]').forEach(function (item) {
        var blocked = Number(item.getAttribute('data-level')) > deepest;
        item.setAttribute('aria-disabled', String(blocked));
        item.title = blocked ? 'Headers step down one level at a time. The deepest level allowed here is H' + deepest + '.' : '';
      });
    }

    function showMenuPanel(name) {
      byId('menu-main').hidden = name !== 'main';
      byId('menu-headers').hidden = name !== 'headers';
      if (name === 'headers') { updateHeaderLevelButtons(); }
      positionBlockMenu();
      focusFirstMenuItem();
    }

    // getInsertBefore returns the node the new block goes before (null means the end of the page).
    // allowedTypes limits which options show (null shows all of them).
    function openBlockMenu(opener, getInsertBefore, allowedTypes) {
      if (!blockMenu.hidden && menuOpener === opener) {
        closeBlockMenu();
        return;
      }
      menuOpener = opener;
      menuGetInsertBefore = getInsertBefore;
      menuInserterTypes = allowedTypes || null;
      blockMenu.querySelectorAll('#menu-main button').forEach(function (item) {
        item.hidden = !!allowedTypes && allowedTypes.indexOf(item.getAttribute('data-type')) < 0;
      });
      blockMenu.hidden = false;

      showMenuPanel('main');
    }

    blockMenu.addEventListener('click', function (event) {
      if (event.target.closest('#menu-back')) { showMenuPanel('main'); return; }
      var item = event.target.closest('[data-type]');
      if (!item) { return; }
      if (item.getAttribute('aria-disabled') === 'true') {
        showNotice('Headers step down one level at a time, so that level can\u2019t go here.');
        return;
      }
      if (item.hasAttribute('data-submenu')) { showMenuPanel('headers'); return; }
      var beforeNode = menuGetInsertBefore ? menuGetInsertBefore() : null;
      closeBlockMenu();
      insertBlockAndFocus(item.getAttribute('data-type'), beforeNode, Number(item.getAttribute('data-level')) || undefined, menuInserterTypes);
    });

    blockMenu.addEventListener('keydown', function (event) {
      var items = Array.prototype.slice.call(blockMenu.querySelectorAll('.menu-panel:not([hidden]) button:not([hidden])'));
      var index = items.indexOf(document.activeElement);
      if (event.key === 'ArrowDown') {
        event.preventDefault();
        items[(index + 1) % items.length].focus();
      } else if (event.key === 'ArrowUp') {
        event.preventDefault();
        items[(index - 1 + items.length) % items.length].focus();
      } else if (event.key === 'ArrowRight' && document.activeElement.hasAttribute('data-submenu')) {
        event.preventDefault();
        showMenuPanel('headers');
      } else if (event.key === 'ArrowLeft' && !byId('menu-headers').hidden) {
        event.preventDefault();
        showMenuPanel('main');
      }
    });

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && !blockMenu.hidden) {
        closeBlockMenu();
        if (menuOpener && document.body.contains(menuOpener)) { menuOpener.focus(); }
      }
    });
    document.addEventListener('click', function (event) {
      var clickedOpener = menuOpener && menuOpener.contains(event.target);
      if (!blockMenu.hidden && !blockMenu.contains(event.target) && !clickedOpener) { closeBlockMenu(); }
    });
    window.addEventListener('scroll', closeBlockMenu, true);
    window.addEventListener('resize', closeBlockMenu);

    // The toolbar chips (Text, Step, Note, Warning) add that block at the very end of the page
    var CHIP_BLOCK_TYPES = { Text: 'paragraph', Step: 'step', Note: 'note', Warning: 'warning' };
    document.querySelectorAll('.block-chip').forEach(function (chip) {
      var type = CHIP_BLOCK_TYPES[chip.textContent.trim()];
      if (type) {
        chip.addEventListener('click', function () {
          insertBlockAndFocus(type, null, undefined, null);
        });
      }
    });

    // Sidebar controls
    byId('page-type').addEventListener('change', function (event) {
      state.pageType = event.target.value;
      markDirty();
    });
    byId('reviewer').addEventListener('change', function (event) {
      state.reviewer = event.target.value;
      renderReviewer();
      markDirty();
    });
    document.querySelectorAll('.segment').forEach(function (segment) {
      segment.addEventListener('click', function () {
        state.visibility = segment.getAttribute('data-value');
        renderVisibility();
        markDirty();
      });
    });

    var memberInput = byId('member-input');
    // Typed text is kept when the field loses focus: leaving the box adds the member, like Enter does
    function commitMemberInput() {
      var name = memberInput.value.trim();
      if (name && state.members.indexOf(name) < 0) {
        state.members.push(name);
        renderMembers();
        renderReviewer();
        markDirty();
      }
      closeMemberInput();
    }
    memberInput.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        commitMemberInput();
      } else if (event.key === 'Escape') {
        closeMemberInput();
      }
    });
    memberInput.addEventListener('blur', commitMemberInput);

    /* ---------- Initial render ---------- */
    renderSidebar();
    layoutContent([{ type: 'step', title: '', text: '' }], 1);
    refreshOutline();
  })();
</script>
</body>
</html>
