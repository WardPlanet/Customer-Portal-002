<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>New Page – Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---------- Design tokens ---------- */
  :root {
    --bg: #f6f6f6;
    --surface: #ffffff;
    --surface-muted: #fafafa;
    --border: #e4e4e7;
    --border-strong: #d4d4d8;
    --text: #18181b;
    --text-muted: #52525b;
    --text-faint: #8a8a93;
    --accent: #0a66d8;
    --accent-soft: #dcebfd;
    --accent-border: #9cc4f5;
    --accent-text: #0a66d8;
    --warn-bg: #fffaeb;
    --warn-border: #f5d77a;
    --warn-icon: #d9640a;
    --success: #1fa65a;
    --radius-card: 16px;
    --radius-block: 12px;
    --radius-pill: 999px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101113;
      --surface: #18191c;
      --surface-muted: #1e2024;
      --border: #2d2f35;
      --border-strong: #3d4048;
      --text: #f2f2f4;
      --text-muted: #b4b4bd;
      --text-faint: #8a8a95;
      --accent: #4d94f0;
      --accent-soft: #14304f;
      --accent-border: #2c5a94;
      --accent-text: #8dbcf7;
      --warn-bg: #2a2410;
      --warn-border: #6b5a1c;
      --warn-icon: #f09a4a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101113;
    --surface: #18191c;
    --surface-muted: #1e2024;
    --border: #2d2f35;
    --border-strong: #3d4048;
    --text: #f2f2f4;
    --text-muted: #b4b4bd;
    --text-faint: #8a8a95;
    --accent: #4d94f0;
    --accent-soft: #14304f;
    --accent-border: #2c5a94;
    --accent-text: #8dbcf7;
    --warn-bg: #2a2410;
    --warn-border: #6b5a1c;
    --warn-icon: #f09a4a;
    color-scheme: dark;
  }

  /* ---------- Base ---------- */
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg { display: block; flex-shrink: 0; }

  .app {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ---------- Top bar ---------- */
  .topbar {
   display: flex;
   align-items: center;
   justify-content: space-between;
   gap: 16px;
   padding: 15px 28px;
   background: var(--surface);
   border-bottom: 1px solid var(--border);
 }
  .topbar-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .leave-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 4px 2px;
    background: none;
    border: 0;
    color: var(--text-muted);
    font-weight: 500;
    font-size: 14px;
    white-space: nowrap;
  }
  .leave-btn:hover { color: var(--text); }
  .topbar-divider { width: 3px; height: 3px; border-radius: 50%; background: var(--text-faint); }
  .page-name {
    font-weight: 600;
    font-size: 14px;
    white-space: nowrap;
  }
  .save-status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    background: var(--surface-muted);
    color: var(--text-muted);
    font-size: 13px;
    white-space: nowrap;
  }
  .save-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--success);
  }

  /* ---------- Workspace ---------- */
  .workspace {
   flex: 1;
   display: grid;
   grid-template-columns: minmax(0, 1fr) 280px;
   gap: 25px;
   align-items: start;
   padding: 28px;
   max-width: 1280px;
   width: 100%;
   margin: 0 auto;
 }

  /* ---------- Editor card ---------- */
  .editor {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    overflow: hidden;
  }
  .toolbar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }
  .tool-group {
    display: flex;
    align-items: center;
    gap: 0;
  }
  .tool-sep {
    width: 1px;
    height: 20px;
    background: var(--border);
    margin: 0 5px;
  }
  .style-select {
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    min-width: 101px;
    padding: 4px 10px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 7px;
    font-size: 13px;
  }
  .icon-btn {
    display: grid;
    place-items: center;
    width: 22px;
    height: 26px;
    background: none;
    border: 0;
    border-radius: 6px;
    color: var(--text-muted);
  }
  .icon-btn:hover { background: var(--surface-muted); color: var(--text); }
  .block-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 11px;
    background: var(--surface-muted);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-pill);
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.4;
  }
  .block-chip:hover { border-color: var(--accent-border); }

  .editor-body {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 220px;
  }

  /* ---------- Canvas (content) ---------- */
  .canvas {
   padding: 24px 16px 20px;
   min-width: 0;
 }
  /* Every piece of content is its own block: title, subtitle, summary, each step */
  .text-block {
   position: relative;
   padding: 6px 32px 6px 8px;
   border: 1px solid transparent;
   border-radius: var(--radius-block);
 }
  .text-block:hover { border-color: var(--border); }
  .text-block:focus-within { border-color: var(--accent-border); }
  .block-tag {
    position: absolute;
    top: -8px;
    left: 10px;
    padding: 0 6px;
    background: var(--surface);
    font-size: 11px;
    font-weight: 500;
    color: var(--text-faint);
    opacity: 0;
    pointer-events: none;
  }
  .text-block:hover .block-tag,
  .text-block:focus-within .block-tag { opacity: 1; }
  .text-block:focus-within .block-tag { color: var(--accent-text); }

  .canvas-title {
    margin: 0;
    font-size: 20px;
    line-height: 1.25;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .canvas-subtitle {
    margin: 0;
    font-size: 14px;
    line-height: 1.45;
    color: var(--text-muted);
  }
  .canvas-summary {
    margin: 0;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-muted);
    max-width: 62ch;
    min-height: 2.4em;
  }
  [contenteditable]:focus { outline: none; }
  [contenteditable]:empty::before { content: attr(data-placeholder); color: var(--text-faint); }

  .blocks {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .block {
    border: 1px solid var(--border);
    border-radius: var(--radius-block);
    background: var(--surface);
  }
  .block:focus-within { border-color: var(--accent-border); }

  .step-block {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 11px 38px 11px 14px;
    border-color: var(--border);
  }
  .step-block > div { flex: 1; min-width: 0; }
  .step-number {
    display: grid;
    place-items: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    font-size: 12px;
    flex-shrink: 0;
  }
  .step-title {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
  }
  .step-text {
    margin: 1px 0 0;
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.4;
  }


  .add-block {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 6px 10px;
    background: none;
    border: 1px dashed var(--accent);
    border-radius: 9px;
    color: var(--accent-text);
    font-size: 13px;
    font-weight: 500;
    line-height: 1.4;
  }
  .add-block:hover { background: var(--accent-soft); }

  /* ---------- On this page (outline) ---------- */
  .outline {
   padding: 20px 15px;
   border-left: 1px solid var(--border);
   background: var(--surface);
 }
  .section-label {
    margin: 0 0 8px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .outline-title {
    margin: 0 0 8px;
    font-size: 13px;
    font-weight: 600;
  }
  .outline-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .outline-list li {
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .outline-list a { color: inherit; text-decoration: none; }
  .outline-list a:hover { color: var(--accent-text); }
  .outline-meta {
    margin: 14px 0 0;
    font-size: 12px;
    color: var(--text-faint);
  }

  /* ---------- Page setup sidebar ---------- */
  .setup {
   background: var(--surface);
   border: 1px solid var(--border);
   border-radius: var(--radius-card);
   padding: 20px;
   display: flex;
   flex-direction: column;
   gap: 20px;
 }
  .field-label {
    display: block;
    margin: 0 0 6px;
    font-size: 13px;
    font-weight: 500;
  }
  .field-label .optional { font-weight: 400; color: var(--text-muted); }
  .field-hint {
    margin: 6px 0 0;
    font-size: 12px;
    color: var(--text-faint);
  }

  .select-field {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 7px 12px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    font-size: 14px;
    text-align: left;
    line-height: 1.4;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip {
    padding: 2px 11px;
    background: var(--surface-muted);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.4;
  }
  .chip[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent-border);
    color: var(--accent-text);
    font-weight: 500;
  }
  .chip-add {
    padding: 1px 11px;
    background: none;
    border: 1px dashed var(--accent);
    border-radius: var(--radius-pill);
    color: var(--accent-text);
    font-size: 13px;
    font-weight: 500;
    line-height: 1.4;
  }

  .avatars { display: flex; align-items: center; }
  .avatar {
    display: grid;
    place-items: center;
    width: 27px;
    height: 27px;
    border-radius: 50%;
    border: 1.5px solid var(--surface);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    margin-right: -6px;
  }
  .avatar-blue { background: #0a66d8; }
  .avatar-grey { background: #6b6e76; }
  .avatar-add {
    background: var(--surface);
    border: 1px dashed var(--accent);
    color: var(--accent-text);
    font-size: 14px;
    font-weight: 400;
  }
  .avatar-small {
    width: 21px;
    height: 21px;
    font-size: 10px;
    margin: 0;
    border: 0;
  }

  .reviewer-field {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 8px 12px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    font-size: 14px;
    text-align: left;
  }

  .segmented {
    display: grid;
    grid-template-columns: 1fr 1fr;
    padding: 2px;
    background: var(--surface-muted);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
  }
  .segment {
    padding: 6px 8px;
    background: none;
    border: 0;
    border-radius: 6px;
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.3;
  }
  .segment[aria-pressed="true"] {
    background: var(--surface);
    color: var(--text);
    font-weight: 600;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
  }

  /* ---------- Footer ---------- */
  .footer {
   display: flex;
   justify-content: flex-end;
   padding: 15px 28px;
   padding-bottom: calc(15px + env(safe-area-inset-bottom, 0px));
   background: var(--surface);
   border-top: 1px solid var(--border);
 }
  .submit-btn {
    padding: 8px 28px;
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
  }
  .submit-btn:hover { filter: brightness(1.08); }

  /* ---------- Draft export / import additions ---------- */
  [contenteditable] { white-space: pre-wrap; overflow-wrap: anywhere; }
  .steps {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .outline-title.is-empty { color: var(--text-faint); font-weight: 500; }
  .save-status.is-unsaved .save-dot { background: var(--text-faint); }

  .select-wrap { position: relative; }
  .select-wrap svg { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); pointer-events: none; }
  select { color: var(--text); }
  select.select-field {
    appearance: none;
    -webkit-appearance: none;
    padding-right: 36px;
    background: var(--surface);
    cursor: pointer;
  }
  .reviewer-select {
    flex: 1;
    min-width: 0;
    appearance: none;
    -webkit-appearance: none;
    background: transparent;
    border: 0;
    padding: 0;
    font-size: 14px;
    cursor: pointer;
  }
  .avatar[hidden] { display: none; }

  .chip-input,
  .inline-input {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--accent-border);
    font: inherit;
    font-size: 13px;
  }
  .chip-input {
    width: 130px;
    padding: 2px 10px;
    border-radius: var(--radius-pill);
  }
  .inline-input {
    width: 100%;
    margin-top: 8px;
    padding: 8px 10px;
    border-radius: 8px;
  }
  .inline-input[hidden] { display: none; }

  .footer { justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .footer-group { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .footer-message {
    flex: 1;
    min-width: 0;
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
  }
  .secondary-btn {
    padding: 8px 16px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.4;
  }
  .secondary-btn:hover { background: var(--surface-muted); }
  .link-btn {
    padding: 6px 4px;
    background: none;
    border: 0;
    color: var(--accent-text);
    font-size: 13px;
    font-weight: 500;
  }
  .link-btn:hover { text-decoration: underline; }

  .draft-dialog {
    width: min(640px, calc(100vw - 32px));
    padding: 20px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
  }
  .draft-dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
  .dialog-title {
    margin: 0 0 6px;
    font-size: 18px;
  }
  .dialog-hint {
    margin: 0 0 14px;
    color: var(--text-muted);
    font-size: 14px;
  }
  .dialog-text {
    width: 100%;
    min-height: 240px;
    padding: 14px;
    background: var(--surface-muted);
    color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
    resize: vertical;
  }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 16px; }

  /* ---------- Required fields + insert lines ---------- */
  :root { --danger: #c62828; --danger-soft: #fdf0ef; --danger-border: #f0b4b0; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --danger: #f2766f; --danger-soft: #2e1816; --danger-border: #7a3330; }
  }
  :root[data-theme="dark"] { --danger: #f2766f; --danger-soft: #2e1816; --danger-border: #7a3330; }

  .text-block.has-error,
  .step-block.has-error { border-color: var(--danger); background: var(--danger-soft); }
  .text-block.has-error .block-tag { opacity: 1; color: var(--danger); }
  .field-error {
    margin: 8px 0 0;
    font-size: 12px;
    font-weight: 500;
    color: var(--danger);
  }

  /* A thin line with a + between neighbouring sections (visual only for now) */
  .section-insert {
   position: relative;
   display: flex;
   align-items: center;
   justify-content: center;
   height: 16px;
   margin: -8px 0;
 }
  .section-insert::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 1px;
    background: var(--border);
  }
  .section-insert-btn {
    position: relative;
    display: grid;
    place-items: center;
    width: 18px;
    height: 18px;
    padding: 0;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 50%;
    color: var(--text-faint);
  }
  .section-insert:hover::before,
  .section-insert:focus-within::before { background: var(--accent-border); }
  .section-insert-btn:hover,
  .section-insert-btn:focus-visible {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* ---------- Required markers + disabled actions ---------- */
  .step-block { position: relative; }
  .required-mark {
    position: absolute;
    left: -4px;
    top: 5px;
    color: var(--danger);
    font-size: 14px;
    font-weight: 700;
    line-height: 1;
    pointer-events: none;
  }
  .required-legend {
    margin: 0 0 8px;
    text-align: right;
    font-size: 12px;
    color: var(--text-faint);
  }
  .required-legend span { color: var(--danger); font-weight: 700; }

  .submit-btn[aria-disabled="true"],
  .secondary-btn[aria-disabled="true"],
  .submit-btn[aria-disabled="true"]:hover,
  .secondary-btn[aria-disabled="true"]:hover {
    background: var(--surface-muted);
    color: var(--text-faint);
    box-shadow: inset 0 0 0 1px var(--border);
    cursor: not-allowed;
    filter: none;
  }

  /* ---------- Remove button on optional blocks ---------- */
  .remove-block {
   position: absolute;
   top: -8px;
   right: -8px;
   display: grid;
   place-items: center;
   width: 20px;
   height: 20px;
   padding: 0;
   background: var(--surface);
   border: 1px solid var(--danger);
   border-radius: 50%;
   color: var(--danger);
 }
  .remove-block:hover,
  .remove-block:focus-visible { background: var(--danger); color: #fff; }

  /* ---------- Add-block menu + optional content blocks ---------- */
  .block-menu {
   position: fixed;
   z-index: 50;
   width: 230px;
   padding: 4px;
   background: var(--surface);
   border: 1px solid var(--border-strong);
   border-radius: 10px;
   box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
 }
  .block-menu[hidden] { display: none; }
  .block-menu button {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 7px 10px;
    background: none;
    border: 0;
    border-radius: 6px;
    text-align: left;
  }
  .block-menu button:hover,
  .block-menu button:focus-visible { background: var(--accent-soft); }
  .menu-title {
    font-size: 14px;
    font-weight: 600;
  }
  .menu-hint {
    font-size: 12px;
    color: var(--text-muted);
  }
  .block-menu button[hidden] { display: none; }
  .menu-text {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0;
  }
  .block-menu svg { color: var(--text-muted); }
  .block-menu button:hover svg,
  .block-menu button:focus-visible svg { color: var(--accent-text); }

  /* Note (yellow) and Warning (red) callouts: tinted block with the symbol in the corner */
  .note-block,
  .warning-block {
   padding: 10px 36px 10px 40px;
 }
  .note-block { background: var(--warn-bg); border-color: var(--warn-border); }
  .warning-block { background: var(--danger-soft); border-color: var(--danger-border); }
  .text-block.note-block:hover,
  .text-block.note-block:focus-within { border-color: var(--warn-icon); }
  .text-block.warning-block:hover,
  .text-block.warning-block:focus-within { border-color: var(--danger); }
  .callout-icon {
    position: absolute;
    top: 11px;
    left: 14px;
    display: grid;
  }
  .callout-icon svg {
    width: 16px;
    height: 16px;
  }
  .note-block .callout-icon { color: var(--warn-icon); }
  .warning-block .callout-icon { color: var(--danger); }
  .block-callout {
    margin: 0;
    font-size: 13px;
    line-height: 1.45;
    color: var(--text);
    min-height: 1.45em;
  }
  .outline-list svg {
    width: 14px;
    height: 14px;
  }

  .block-paragraph {
    margin: 0;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-muted);
    min-height: 2.4em;
  }
  .block-header {
    margin: 0;
    font-size: 18px;
    line-height: 1.3;
    font-weight: 700;
    letter-spacing: -0.005em;
  }
  .outline-list li.outline-header { color: var(--text); font-weight: 600; }

  /* ---------- Header levels (H1 to H5) and the header submenu ---------- */
  .block-header.level-1 {
   font-size: 22px;
 }
  .block-header.level-2 {
    font-size: 18px;
  }
  .block-header.level-3 {
    font-size: 16px;
  }
  .block-header.level-4 {
    font-size: 15px;
  }
  .block-header.level-5 {
    font-size: 14px;
    letter-spacing: 0;
  }

  .menu-panel[hidden] { display: none; }
  .menu-chevron { margin-left: auto; }
  .menu-back {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
  }
  .header-sample { font-weight: 700; line-height: 1.25; color: var(--text); }
  .sample-1 {
    font-size: 20px;
  }
  .sample-2 {
    font-size: 17px;
  }
  .sample-3 {
    font-size: 15px;
  }
  .sample-4 {
    font-size: 13px;
  }
  .sample-5 {
    font-size: 12px;
  }
  .level-hint { margin-left: auto; }

  /* ---------- Rich text (paragraph blocks only), step sections, link popover ---------- */
  [data-rich] ul,
  [data-rich] ol { margin: 6px 0; padding-left: 1.5em; }
  [data-rich] a { color: var(--accent-text); text-decoration: underline; }
  .toolbar .icon-btn[aria-disabled="true"] { opacity: 0.4; cursor: not-allowed; }
  .toolbar .icon-btn[aria-disabled="true"]:hover { background: none; color: var(--text-muted); }
  .toolbar .icon-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-text); }

  .step-actions {
    align-self: flex-start;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: -2px 0 0 2px;
  }
  /* Rounded boxes. Add step matches the selected "Tools & Access" chip; Warning and Note match their blocks. */
  .step-actions button {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 11px;
    border: 1px solid;
    border-radius: var(--radius-pill);
    font-size: 13px;
    font-weight: 500;
    line-height: 1.4;
  }
  .step-actions .step-add { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent-text); }
  .step-actions .step-add:hover { border-color: var(--accent); }
  .step-actions .step-warning { background: var(--danger-soft); border-color: var(--danger-border); color: var(--danger); }
  .step-actions .step-warning:hover { border-color: var(--danger); }
  .step-actions .step-note { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn-icon); }
  .step-actions .step-note:hover { border-color: var(--warn-icon); }
  .step-actions svg { width: 13px; height: 13px; }

  .link-popover {
    position: fixed;
    z-index: 60;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
  }
  .link-popover[hidden] { display: none; }
  .link-popover input {
    width: 200px;
    padding: 6px 8px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    font: inherit;
    font-size: 13px;
  }
  .link-popover button {
    padding: 6px 10px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
  }
  .link-popover .link-apply { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ---------- AI assist ---------- */
  :root { --ai: #6d3fd9; --ai-soft: #f4effe; --ai-border: #cdb8f6; --ai-contrast: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ai: #b79af5; --ai-soft: #25193d; --ai-border: #5b3f94; --ai-contrast: #1b1230; }
  }
  :root[data-theme="dark"] { --ai: #b79af5; --ai-soft: #25193d; --ai-border: #5b3f94; --ai-contrast: #1b1230; }

  .ai-chip { margin-left: auto; color: var(--ai); background: var(--ai-soft); border-color: var(--ai-border); }
  .ai-chip:hover { border-color: var(--ai); }
  .ai-chip[aria-disabled="true"],
  .ai-chip[aria-disabled="true"]:hover {
    background: var(--surface-muted);
    color: var(--text-faint);
    border-color: var(--border);
    cursor: not-allowed;
  }
  .ai-chip.is-busy { cursor: progress; }
  .ai-chip.is-busy svg { animation: ai-pulse 1s ease-in-out infinite; }
  @keyframes ai-pulse { 50% { opacity: 0.3; } }

  .ai-suggestion {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-top: 8px;
    padding: 8px 10px;
    background: var(--ai-soft);
    border: 1px dashed var(--ai-border);
    border-radius: 8px;
    color: var(--text);
  }
  .ai-suggestion-body { flex: 1; min-width: 0; }
  .ai-suggestion-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ai);
  }
  .ai-suggestion-reason {
    margin: 1px 0 4px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .ai-suggestion-text {
    font-size: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .ai-suggestion-text ul,
  .ai-suggestion-text ol { margin: 4px 0; padding-left: 1.4em; }
  .ai-suggestion-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .ai-accept,
  .ai-dismiss {
    display: grid;
    place-items: center;
    width: 22px;
    height: 22px;
    padding: 0;
    border-radius: 50%;
  }
  .ai-accept { background: var(--ai); border: 1px solid var(--ai); color: var(--ai-contrast); }
  .ai-accept:hover { filter: brightness(1.12); }
  .ai-dismiss { background: var(--surface); border: 1px solid var(--danger); color: var(--danger); }
  .ai-dismiss:hover { background: var(--danger); color: #fff; }

  /* ---------- Icon sizes (matched to the reference design) ---------- */
  .leave-btn svg { width: 14px; height: 14px; }
  .toolbar .icon-btn svg { width: 15px; height: 15px; }
  .style-select svg { width: 12px; height: 12px; }
  .block-chip svg { width: 13px; height: 13px; }
  .select-wrap svg { width: 14px; height: 14px; right: 12px; }
  .block-menu svg { width: 16px; height: 16px; }
  .block-menu .menu-chevron { width: 12px; height: 12px; }
  .section-insert-btn svg,
  .remove-block svg,
  .ai-accept svg,
  .ai-dismiss svg { width: 10px; height: 10px; }

  /* ---------- AI assist button in the corner of each section ---------- */
  .section-ai {
    position: absolute;
    top: 6px;
    right: 6px;
    display: grid;
    place-items: center;
    width: 22px;
    height: 22px;
    padding: 0;
    background: var(--ai-soft);
    border: 1px solid var(--ai-border);
    border-radius: 50%;
    color: var(--ai);
    opacity: 0.55;
  }
  .section-ai[hidden] { display: none; }
  .text-block:hover > .section-ai,
  .text-block:focus-within > .section-ai,
  .step-block:hover > .section-ai,
  .step-block:focus-within > .section-ai,
  .section-ai:focus-visible,
  .section-ai.is-busy { opacity: 1; }
  .section-ai:hover { border-color: var(--ai); }
  .section-ai svg { width: 12px; height: 12px; }
  .section-ai.is-busy { cursor: progress; }
  .section-ai.is-busy svg { animation: ai-pulse 1s ease-in-out infinite; }

  /* A section with no text still shows the button, greyed out */
  .text-block .section-ai[aria-disabled="true"],
  .step-block .section-ai[aria-disabled="true"],
  .section-ai[aria-disabled="true"]:hover {
    background: var(--surface-muted);
    border-color: var(--border);
    color: var(--text-faint);
    cursor: not-allowed;
    opacity: 0.6;
  }

  /* Header levels that would break the hierarchy */
  .block-menu button[aria-disabled="true"] { opacity: 0.4; cursor: not-allowed; }
  .block-menu button[aria-disabled="true"]:hover { background: none; }

  /* ---------- Responsive ---------- */
  @media (max-width: 1100px) {
    .workspace { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 820px) {
    .editor-body { grid-template-columns: minmax(0, 1fr); }
    .outline { display: none; }
    .canvas { padding: 20px 12px; }
    .workspace { padding: 16px; }
    .topbar { padding: 14px 16px; }
    .save-status span:last-child { display: none; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="leave-btn" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Leave without saving
      </button>
      <span class="topbar-divider" aria-hidden="true"></span>
      <span class="page-name">New Page</span>
    </div>
    <div class="save-status is-unsaved" id="save-status" role="status">
      <span class="save-dot" aria-hidden="true"></span>
      <span id="save-status-text">Draft not saved yet</span>
    </div>
  </header>

  <main class="workspace">

    <!-- Editor -->
    <section class="editor" aria-label="Page editor">

      <!-- Toolbar -->
      <div class="toolbar" role="toolbar" aria-label="Formatting">
        <button class="style-select" type="button" aria-label="Text style">
          Paragraph
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <span class="tool-sep" aria-hidden="true"></span>
        <div class="tool-group">
          <button class="icon-btn" type="button" aria-label="Bold" data-format="bold"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5h6a3.5 3.5 0 0 1 0 7H7zM7 12h7a3.5 3.5 0 0 1 0 7H7z"/></svg></button>
          <button class="icon-btn" type="button" aria-label="Italic" data-format="italic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 4h-9M14 20H5M15 4L9 20"/></svg></button>
          <button class="icon-btn" type="button" aria-label="Underline" data-format="underline"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v7a6 6 0 0 0 12 0V4M4 21h16"/></svg></button>
        </div>
        <span class="tool-sep" aria-hidden="true"></span>
        <div class="tool-group">
          <button class="icon-btn" type="button" aria-label="Bulleted list" data-format="insertUnorderedList"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg></button>
          <button class="icon-btn" type="button" aria-label="Numbered list" data-format="insertOrderedList"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6h11M10 12h11M10 18h11M4 5l1-1v4M3.5 14h2l-2 3h2.5"/></svg></button>
        </div>
        <span class="tool-sep" aria-hidden="true"></span>
        <div class="tool-group">
          <button class="icon-btn" type="button" aria-label="Insert link" data-format="link"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg></button>
          <button class="icon-btn" type="button" aria-label="Insert image"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg></button>
        </div>
        <span class="tool-sep" aria-hidden="true"></span>
        <div class="tool-group" style="gap: 8px; flex-wrap: wrap;">
          <button class="block-chip" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4v16M17 4v16M19 4H9.5a4.5 4.5 0 0 0 0 9H13"/></svg>
            Text
          </button>
          <button class="block-chip" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 6h10M11 12h10M11 18h10M3 6l1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/></svg>
            Step
          </button>
          <button class="block-chip" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v5M12 8h.01"/></svg>
            Note
          </button>
          <button class="block-chip" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></svg>
            Warning
          </button>
        </div>
        <button class="block-chip ai-chip" id="ai-assist" type="button" aria-disabled="true" title="Fill in the required fields (*) first">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15z"/></svg>
          <span class="ai-label">AI assist</span>
        </button>
      </div>

      <div class="editor-body">

        <!-- Canvas -->
        <article class="canvas">
          <p class="required-legend"><span>*</span> Required to save a draft</p>
          <div class="blocks">
            <div class="text-block">
              <span class="block-tag">Page title</span>
              <span class="required-mark" aria-hidden="true">*</span>
              <h1 class="canvas-title" id="field-title" data-single-line contenteditable="true" spellcheck="true" data-placeholder="Page title (required)"></h1>
            </div>

            <div class="text-block">
              <span class="block-tag">Description</span>
              <span class="required-mark" aria-hidden="true">*</span>
              <p class="canvas-subtitle" id="field-subtitle" data-single-line contenteditable="true" spellcheck="true" data-placeholder="Description (required)"></p>
            </div>

            <div class="text-block">
              <span class="block-tag">Opening paragraph</span>
              <span class="required-mark" aria-hidden="true">*</span>
              <p class="canvas-summary" id="field-summary" data-rich contenteditable="true" spellcheck="true" data-placeholder="Opening paragraph (required): what this page covers and when to use it"></p>
            </div>

            <!-- Paragraph, header and step blocks are created by the script, in page order -->
            <div class="steps" id="content-blocks"></div>
          </div>
        </article>

        <!-- On this page -->
        <aside class="outline" aria-label="On this page">
          <h2 class="section-label">On this page</h2>
          <p class="outline-title is-empty" id="outline-title">Untitled page</p>
          <ul class="outline-list" id="outline-list"></ul>
          <p class="outline-meta" id="outline-meta">No steps yet</p>
        </aside>

      </div>
    </section>

    <!-- Page setup -->
    <aside class="setup" aria-label="Page setup">
      <h2 class="section-label" style="margin: 0;">Page setup</h2>

      <div>
        <label class="field-label" for="page-type">Page Type</label>
        <div class="select-wrap">
          <select class="select-field" id="page-type"></select>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>

      <div>
        <span class="field-label">Where This Lives</span>
        <div class="chips" id="chips"></div>
      </div>

      <div>
        <span class="field-label">Linked Team Members</span>
        <div class="avatars" id="members"></div>
        <input class="inline-input" id="member-input" type="text" placeholder="Full name, then Enter" aria-label="Add a team member" hidden>
      </div>

      <div>
        <label class="field-label" for="reviewer">Reviewer <span class="optional">(optional)</span></label>
        <div class="reviewer-field">
          <span class="avatar avatar-blue avatar-small" id="reviewer-avatar" hidden></span>
          <select class="reviewer-select" id="reviewer"></select>
        </div>
        <p class="field-hint">Only used if this page is Client-Safe</p>
      </div>

      <div>
        <span class="field-label">Visibility</span>
        <div class="segmented" role="group" aria-label="Visibility">
          <button class="segment" type="button" data-value="Internal-Only" aria-pressed="true">Internal-Only</button>
          <button class="segment" type="button" data-value="Client-Safe" aria-pressed="false">Client-Safe</button>
        </div>
      </div>
    </aside>

  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-group">
      <button class="secondary-btn" type="button" id="open-draft">Open draft</button>
      <button class="link-btn" type="button" id="paste-draft">Paste draft text</button>
      <input type="file" id="draft-file" accept=".txt,text/plain" hidden>
    </div>
    <span class="footer-message" id="footer-message" role="status"></span>
    <div class="footer-group">
      <button class="secondary-btn" type="button" id="save-draft" aria-disabled="true">Save draft</button>
      <button class="submit-btn" type="button" id="submit-draft" aria-disabled="true">Submit to Draft</button>
    </div>
  </footer>

</div>

<div class="block-menu" id="block-menu" role="menu" aria-label="Add a block" hidden>
  <div class="menu-panel" id="menu-main">
  <button type="button" role="menuitem" data-type="header" data-submenu="headers" aria-haspopup="true">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4v16M18 4v16M6 12h12"/></svg>
    <span class="menu-text"><span class="menu-title">Header</span><span class="menu-hint">A section heading (H1 to H5)</span></span>
    <svg class="menu-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </button>
  <button type="button" role="menuitem" data-type="paragraph">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 4v16M17 4v16M19 4H9.5a4.5 4.5 0 0 0 0 9H13"/></svg>
    <span class="menu-text"><span class="menu-title">Text</span><span class="menu-hint">Free-form text</span></span>
  </button>
  <button type="button" role="menuitem" data-type="step">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 6h10M11 12h10M11 18h10M3 6l1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/></svg>
    <span class="menu-text"><span class="menu-title">Step</span><span class="menu-hint">A numbered step</span></span>
  </button>
  <button type="button" role="menuitem" data-type="note">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v5M12 8h.01"/></svg>
    <span class="menu-text"><span class="menu-title">Note</span><span class="menu-hint">A highlighted tip or aside</span></span>
  </button>
  <button type="button" role="menuitem" data-type="warning">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></svg>
    <span class="menu-text"><span class="menu-title">Warning</span><span class="menu-hint">A caution to call out</span></span>
  </button>
  </div>

  <!-- Header submenu: each sample is sized to match its level -->
  <div class="menu-panel" id="menu-headers" hidden>
    <button type="button" role="menuitem" class="menu-back" id="menu-back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      Header
    </button>
    <button type="button" role="menuitem" data-type="header" data-level="1"><span class="header-sample sample-1">Heading 1</span><span class="menu-hint level-hint">H1</span></button>
    <button type="button" role="menuitem" data-type="header" data-level="2"><span class="header-sample sample-2">Heading 2</span><span class="menu-hint level-hint">H2</span></button>
    <button type="button" role="menuitem" data-type="header" data-level="3"><span class="header-sample sample-3">Heading 3</span><span class="menu-hint level-hint">H3</span></button>
    <button type="button" role="menuitem" data-type="header" data-level="4"><span class="header-sample sample-4">Heading 4</span><span class="menu-hint level-hint">H4</span></button>
    <button type="button" role="menuitem" data-type="header" data-level="5"><span class="header-sample sample-5">Heading 5</span><span class="menu-hint level-hint">H5</span></button>
  </div>
</div>

<div class="link-popover" id="link-popover" role="dialog" aria-label="Add a link" hidden>
  <input type="text" id="link-input" placeholder="https://example.com" aria-label="Link address" autocomplete="off">
  <button type="button" class="link-apply" id="link-apply">Apply</button>
  <button type="button" id="link-cancel">Cancel</button>

<dialog id="draft-dialog" class="draft-dialog" aria-labelledby="draft-dialog-title">
  <h2 id="draft-dialog-title" class="dialog-title">Draft text</h2>
  <p class="dialog-hint" id="draft-dialog-hint"></p>
  <textarea id="draft-dialog-text" class="dialog-text" spellcheck="false" aria-label="Draft text"></textarea>
  <div class="dialog-actions">
    <button class="secondary-btn" type="button" id="draft-dialog-close">Close</button>
    <button class="submit-btn" type="button" id="draft-dialog-load">Load into editor</button>
  </div>
</dialog>

<script>
  (function () {
    'use strict';

    /* =====================================================================
       Draft file format (plain text)

         PAGE EDITOR DRAFT
         FORMAT: 1
         SAVED: <timestamp>

         [TITLE]
         ...text...
         [BLOCK 1 PARAGRAPH]   (or HEADER, or STEP TITLE + STEP TEXT)
         ...

       Each [SECTION] header starts a section. Everything before the first
       header is ignored. A content line that begins with [ or ~ is saved
       with a leading ~ so it can never be mistaken for a header.
       ===================================================================== */

    var NL = '\n';
    var FORMAT_VERSION = '2';
    var ESCAPE = '~';

    var BASE_PAGE_TYPES = ['Process Documentation', 'Policy', 'Reference Guide', 'How-To Guide'];
    var BASE_LOCATIONS = ['Tools & Access', 'Billing Team'];
    var KNOWN_SECTIONS = ['TITLE', 'SUBTITLE', 'SUMMARY', 'PAGE TYPE', 'WHERE THIS LIVES', 'LINKED TEAM MEMBERS', 'REVIEWER', 'VISIBILITY'];

    /* ---------- State for the Page Setup sidebar (text fields live in the DOM) ---------- */
    var state = {
      pageTypes: BASE_PAGE_TYPES.slice(),
      pageType: 'Process Documentation',
      locations: [{ name: 'Tools & Access', on: true }, { name: 'Billing Team', on: false }],
      members: ['Jordan Mackey', 'Riley Torres'],
      reviewer: 'Jordan Mackey',
      visibility: 'Internal-Only',
      keywords: []   // search keywords, generated by AI each time a draft is saved
    };

    function byId(id) { return document.getElementById(id); }

    var titleEl = byId('field-title');
    var subtitleEl = byId('field-subtitle');
    var summaryEl = byId('field-summary');
    var contentEl = byId('content-blocks');

    /* ---------- Small helpers ---------- */
    function readText(el) {
      // Paragraph fields hold formatting, so they are read back as formatted plain text
      if (el.hasAttribute('data-rich')) { return htmlToMarkdown(el).trim(); }
      return el.innerText.replace(/\r/g, '').trim();
    }

    function initials(name) {
      var parts = name.trim().split(/\s+/).filter(Boolean);
      if (!parts.length) { return '?'; }
      var first = parts[0].charAt(0);
      var last = parts.length > 1 ? parts[parts.length - 1].charAt(0) : '';
      return (first + last).toUpperCase();
    }

    function addOption(select, value, label) {
      var option = document.createElement('option');
      option.value = value;
      option.textContent = label;
      select.appendChild(option);
    }

    /* ---------- Save status + notices ---------- */
    function setStatus(text, isSaved) {
      byId('save-status-text').textContent = text;
      byId('save-status').classList.toggle('is-unsaved', !isSaved);
    }

    function markDirty() { setStatus('Unsaved changes', false); }

    var noticeTimer = null;
    function showNotice(message) {
      var el = byId('footer-message');
      el.textContent = message;
      clearTimeout(noticeTimer);
      noticeTimer = setTimeout(function () { el.textContent = ''; }, 7000);
    }

    /* ---------- Steps ---------- */
    /* ---------- Content blocks (paragraph, header, step) ---------- */

    // Adds a step at the very end of the page (used when a draft has no steps at all)
    function addStep(title, text) {
      return addBlock('step', { title: title, text: text }, null, null);
    }

    function buildBlockElement(type, values) {
      return type === 'step'
        ? buildStepBlock(values.title, values.text)
        : buildTextBlock(type, values.text, values.level);
    }

    // Inserts a block before beforeNode (null means the end), followed by its own insert line.
    // inserterTypes limits what that new insert line offers (null offers every block type).
    function addBlock(type, values, beforeNode, inserterTypes) {
      var block = buildBlockElement(type, values);
      contentEl.insertBefore(block, beforeNode || null);
      if (inserterTypes !== false) { block.after(createInserter(inserterTypes || null)); }
      refreshBlocks();
      return block;
    }

    // Header levels run from 1 (largest) to 5 (smallest); anything else becomes 2
    function clampHeaderLevel(level) {
      var n = Math.round(Number(level));
      return n >= 1 && n <= 5 ? n : 2;
    }

    // Settings for every block type that is a single editable text field
    var TEXT_BLOCKS = {
      paragraph: { blockClass: 'paragraph-block', fieldClass: 'block-paragraph', element: 'p', label: 'Text', placeholder: 'Write some text', rich: true },
      header: { blockClass: 'header-block', fieldClass: 'block-header', element: 'h2', label: 'Header', placeholder: 'Header' },
      note: { blockClass: 'note-block', fieldClass: 'block-callout', element: 'p', label: 'Note', placeholder: 'Write a note' },
      warning: { blockClass: 'warning-block', fieldClass: 'block-callout', element: 'p', label: 'Warning', placeholder: 'Write a warning' }
    };

    function buildTextBlock(type, text, level) {
      var config = TEXT_BLOCKS[type] || TEXT_BLOCKS.paragraph;
      var headerLevel = type === 'header' ? clampHeaderLevel(level) : 0;

      var block = document.createElement('div');
      block.className = 'text-block ' + config.blockClass;
      if (headerLevel) { block.setAttribute('data-level', String(headerLevel)); }

      var tag = document.createElement('span');
      tag.className = 'block-tag';
      tag.textContent = headerLevel ? 'H' + headerLevel : config.label;
      block.appendChild(tag);

      // Notes and warnings carry their symbol in the top-left corner
      if (type === 'note' || type === 'warning') {
        var icon = document.createElement('span');
        icon.className = 'callout-icon';
        icon.setAttribute('aria-hidden', 'true');
        icon.innerHTML = type === 'note' ? NOTE_ICON : WARNING_ICON;
        block.appendChild(icon);
      }

      var field = document.createElement(headerLevel ? 'h' + headerLevel : config.element);
      field.className = config.fieldClass + (headerLevel ? ' level-' + headerLevel : '');
      field.contentEditable = 'true';
      field.spellcheck = true;
      field.setAttribute('data-placeholder', config.placeholder);
      if (type === 'header') { field.setAttribute('data-single-line', ''); }
      if (config.rich) {
        field.setAttribute('data-rich', '');
        field.innerHTML = markdownToHtml(text || '');
      } else {
        field.textContent = text || '';
      }
      block.appendChild(field);

      return block;
    }

    function createRequiredMark() {
      var mark = document.createElement('span');
      mark.className = 'required-mark';
      mark.setAttribute('aria-hidden', 'true');
      mark.textContent = '*';
      return mark;
    }

    // Removes a block together with the insert line (or "+ Add step" button) that belongs to it
    function removeBlockAndLines(block) {
      var next = block.nextElementSibling;
      var previous = block.previousElementSibling;
      if (next && next.classList.contains('step-actions')) {
        var isOnlyStepInSection = !(previous && previous.classList.contains('step-block'));
        if (isOnlyStepInSection) {
          var lineAfterButton = next.nextElementSibling;
          next.remove();
          if (lineAfterButton && lineAfterButton.classList.contains('section-insert')) { lineAfterButton.remove(); }
        }
      } else if (next && next.classList.contains('section-insert')) {
        next.remove();
      }
      block.remove();
    }

    function createRemoveButton(block) {
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'remove-block';
      button.setAttribute('aria-label', 'Remove this block');
      button.title = 'Remove this block';
      button.innerHTML = CLOSE_ICON;
      button.addEventListener('click', function () {
        removeBlockAndLines(block);
        refreshBlocks();
        markDirty();
      });
      return button;
    }

    // The first step is required (red *). Every other block can be removed (red x).
    function setRequiredDecoration(block, isRequired) {
      var mark = block.querySelector('.required-mark');
      var removeButton = block.querySelector('.remove-block');
      if (isRequired) {
        if (removeButton) { removeButton.remove(); }
        if (!mark) { block.appendChild(createRequiredMark()); }
      } else {
        if (mark) { mark.remove(); }
        if (!removeButton) { block.appendChild(createRemoveButton(block)); }
      }
    }

    // Re-numbers steps and refreshes which block is required, after any add or remove
    // Steps that sit together form a step section. Numbering restarts at 1 in each section, each
    // section ends with a "+ Add step" button, and the first step on the page is the required one.
    function refreshBlocks() {
      Array.prototype.slice.call(contentEl.querySelectorAll(':scope > .step-actions')).forEach(function (row) {
        row.remove();
      });

      var stepNumber = 0;
      var sawFirstStep = false;
      var children = Array.prototype.slice.call(contentEl.children);

      children.forEach(function (child, index) {
        var isStep = child.classList.contains('step-block');
        if (!isStep && !child.classList.contains('text-block')) { return; }

        var isRequired = false;
        if (isStep) {
          var previous = children[index - 1];
          var next = children[index + 1];
          var startsSection = !(previous && previous.classList.contains('step-block'));
          var endsSection = !(next && next.classList.contains('step-block'));

          stepNumber = startsSection ? 1 : stepNumber + 1;
          isRequired = !sawFirstStep;
          sawFirstStep = true;

          child.querySelector('.step-number').textContent = String(stepNumber);
          child.querySelector('.step-title').setAttribute('data-placeholder', isRequired ? 'Step title (required)' : 'Step title');
          if (endsSection) { child.after(createStepActions()); }
        }
        setRequiredDecoration(child, isRequired);
      });

      enforceHeaderHierarchy();
      removeRedundantInserters();
      refreshOutline();
    }

    /* ---------- Header hierarchy ----------
       Headers step down one level at a time. The first header on the page is an H1, and every
       later header is at most one level deeper than the header before it: after an H1 you can use
       H1 or H2, after an H2 you can use H1, H2 or H3, and so on. */

    // The deepest header level allowed at an insertion point (beforeNode null means the end)
    function deepestAllowedHeaderLevel(beforeNode) {
      var levelAbove = 0;
      contentBlocks().forEach(function (block) {
        var isAbove = !beforeNode || (beforeNode.compareDocumentPosition(block) & Node.DOCUMENT_POSITION_PRECEDING);
        if (isAbove && block.classList.contains('header-block')) {
          levelAbove = Number(block.getAttribute('data-level')) || 2;
        }
      });
      return Math.min(levelAbove + 1, 5);
    }

    function setHeaderLevel(block, level) {
      var field = block.querySelector('[contenteditable]');
      var replacement = document.createElement('h' + level);
      Array.prototype.forEach.call(field.attributes, function (attribute) {
        replacement.setAttribute(attribute.name, attribute.value);
      });
      replacement.className = 'block-header level-' + level;
      replacement.textContent = field.textContent;
      block.replaceChild(replacement, field);
      block.setAttribute('data-level', String(level));
      block.querySelector('.block-tag').textContent = 'H' + level;
    }

    // Adding, removing or loading headers can leave one too deep; pull it up to the deepest level allowed
    function enforceHeaderHierarchy() {
      var previous = 0;
      contentBlocks().forEach(function (block) {
        if (!block.classList.contains('header-block')) { return; }
        var level = Number(block.getAttribute('data-level')) || 2;
        var allowed = Math.min(previous + 1, 5);
        if (level > allowed) {
          setHeaderLevel(block, allowed);
          level = allowed;
        }
        previous = level;
      });
    }

    // No + line sits directly above or below "+ Add a block" (the button covers that spot), and two
    // + lines never sit side by side. The + under the opening paragraph always stays.
    function removeRedundantInserters() {
      var addButton = byId('add-block');
      var topLine = contentEl.firstElementChild;
      if (addButton) {
        [addButton.previousElementSibling, addButton.nextElementSibling].forEach(function (neighbour) {
          if (neighbour && neighbour !== topLine && neighbour.classList.contains('section-insert')) { neighbour.remove(); }
        });
      }
      Array.prototype.slice.call(contentEl.querySelectorAll(':scope > .section-insert')).forEach(function (line) {
        var before = line.previousElementSibling;
        if (before && before.classList.contains('section-insert')) { line.remove(); }
      });
    }

    // Every block in page order: { type: 'paragraph' | 'header' | 'step', title?, text }
    function readBlocks() {
      return contentBlocks().map(function (block) {
        if (block.classList.contains('step-block')) {
          return {
            type: 'step',
            number: Number(block.querySelector('.step-number').textContent),
            title: readText(block.querySelector('.step-title')),
            text: readText(block.querySelector('.step-text'))
          };
        }
        var type = Object.keys(TEXT_BLOCKS).filter(function (key) {
          return block.classList.contains(TEXT_BLOCKS[key].blockClass);
        })[0] || 'paragraph';
        var result = { type: type, text: readText(block.querySelector('[contenteditable]')) };
        if (type === 'header') { result.level = Number(block.getAttribute('data-level')) || 2; }
        return result;
      });
    }

    function buildStepBlock(title, text) {
      var block = document.createElement('div');
      block.className = 'block step-block';

      var number = document.createElement('span');
      number.className = 'step-number';

      var body = document.createElement('div');

      var heading = document.createElement('h2');
      heading.className = 'step-title';
      heading.contentEditable = 'true';
      heading.spellcheck = true;
      heading.setAttribute('data-single-line', '');
      heading.setAttribute('data-placeholder', 'Step title');
      heading.textContent = title || '';

      var paragraph = document.createElement('p');
      paragraph.className = 'step-text';
      paragraph.contentEditable = 'true';
      paragraph.spellcheck = true;
      paragraph.setAttribute('data-placeholder', 'Describe this step');
      paragraph.textContent = text || '';

      body.appendChild(heading);
      body.appendChild(paragraph);
      block.appendChild(number);
      block.appendChild(body);
      return block;
    }

    function readSteps() {
      return stepBlocks().map(function (block) {
        return {
          title: readText(block.querySelector('.step-title')),
          text: readText(block.querySelector('.step-text'))
        };
      });
    }

    // Real content blocks only. The container also holds the insert lines and the "+ Add a block" button.
    function contentBlocks() {
      return Array.prototype.filter.call(contentEl.children, function (child) {
        return child.classList.contains('step-block') || child.classList.contains('text-block');
      });
    }

    // Step blocks only (paragraph and header blocks share the same container)
    function stepBlocks() {
      return Array.prototype.filter.call(contentEl.children, function (child) {
        return child.classList.contains('step-block');
      });
    }

    /* ---------- Insert lines between sections (visual only, no behavior yet) ---------- */
    var PLUS_ICON = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';

    var CLOSE_ICON = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

    var NOTE_ICON = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v5M12 8h.01"/></svg>';
    var WARNING_ICON = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></svg>';

    function createInserter(allowedTypes) {
      var line = document.createElement('div');
      line.className = 'section-insert';

      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'section-insert-btn';
      button.setAttribute('aria-label', 'Add a block here');
      button.title = 'Add a block here';
      button.innerHTML = PLUS_ICON;
      button.addEventListener('click', function () {
        // New blocks go directly below this line, each with its own insert line below it
        openBlockMenu(button, function () { return line.nextSibling; }, allowedTypes);
      });

      line.appendChild(button);
      return line;
    }

    /* ---------- Page layout: blocks, insert lines and the "+ Add a block" button ---------- */
    // The row under each step section. "Add step" adds another step to the section (no insert
    // line in between); "+ Warning" and "+ Note" add that callout directly below the section.
    function createStepActions() {
      var row = document.createElement('div');
      row.className = 'step-actions';

      function addAction(label, className, iconHtml, onClick) {
        var button = document.createElement('button');
        button.type = 'button';
        button.className = className;
        // A plus, then the block's symbol (Warning and Note), then the label
        var plus = document.createElement('span');
        plus.textContent = '+';
        var text = document.createElement('span');
        text.textContent = label;
        button.appendChild(plus);
        if (iconHtml) { button.insertAdjacentHTML('beforeend', iconHtml); }
        button.appendChild(text);
        button.addEventListener('click', onClick);
        row.appendChild(button);
      }

      addAction('Add step', 'step-add', '', function () {
        var block = addBlock('step', {}, row, false);
        markDirty();
        block.querySelector('.step-title').focus();
      });
      addAction('Warning', 'step-warning', WARNING_ICON, function () { addCalloutBelow(row, 'warning'); });
      addAction('Note', 'step-note', NOTE_ICON, function () { addCalloutBelow(row, 'note'); });
      return row;
    }

    function addCalloutBelow(row, type) {
      var block = addBlock(type, {}, row.nextSibling, null);
      markDirty();
      block.querySelector('[contenteditable]').focus();
    }

    function createAddBlockButton() {
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'add-block';
      button.id = 'add-block';
      button.textContent = '+ Add a block';
      button.addEventListener('click', function () {
        // Full menu; the new block goes directly below this button
        openBlockMenu(button, function () { return button.nextSibling; }, null);
      });
      return button;
    }

    // Insert lines sit below the opening paragraph and below every block that is added later.
    // There are none directly above or below "+ Add a block"; the button covers that spot.
    // The title and description are single fields, so they get no insert line.
    // aboveButton is how many blocks sit above the "+ Add a block" button.
    function layoutContent(blocks, aboveButton) {
      var count = Math.max(0, Math.min(aboveButton, blocks.length));
      contentEl.textContent = '';
      contentEl.appendChild(createInserter(null));

      function appendAddButton() {
        contentEl.appendChild(createAddBlockButton());
      }

      if (count === 0) { appendAddButton(); }
      blocks.forEach(function (values, index) {
        var isLastAboveButton = index === count - 1;
        var next = blocks[index + 1];
        // Steps in the same section sit together, and a Note or Warning that follows a step section
        // belongs to it, so neither gets an insert line in between
        var skipsInserter = !isLastAboveButton && values.type === 'step' && next
          && ((next.type === 'step' && next.continues) || next.type === 'note' || next.type === 'warning');

        contentEl.appendChild(buildBlockElement(values.type, values));
        // The last block above the button needs no insert line: "+ Add a block" sits right below it
        if (!skipsInserter && !isLastAboveButton) {
          contentEl.appendChild(createInserter(null));
        }
        if (isLastAboveButton) { appendAddButton(); }
      });

      refreshBlocks();
    }

    /* ---------- Required fields ---------- */
    function clearBlockError(block) {
      block.classList.remove('has-error');
      var message = block.querySelector('.field-error');
      if (message) { message.remove(); }
    }

    function flagBlock(block, message, container) {
      block.classList.add('has-error');
      var note = document.createElement('p');
      note.className = 'field-error';
      note.setAttribute('role', 'alert');
      note.textContent = message;
      (container || block).appendChild(note);
    }

    var REQUIRED_FIELDS = [
      { el: titleEl, label: 'page title', message: 'Add a page title to save a draft.' },
      { el: subtitleEl, label: 'description', message: 'Add a description to save a draft.' },
      { el: summaryEl, label: 'opening paragraph', message: 'Add an opening paragraph to save a draft.' }
    ];

    function anyStepHasTitle() {
      return stepBlocks().some(function (block) {
        return readText(block.querySelector('.step-title')) !== '';
      });
    }

    function isDraftComplete() {
      var fieldsFilled = REQUIRED_FIELDS.every(function (field) { return readText(field.el) !== ''; });
      return fieldsFilled && anyStepHasTitle();
    }

    // Grey out Save draft and Submit until every required field is filled in
    function updateSaveState() {
      var complete = isDraftComplete();
      ['save-draft', 'submit-draft'].forEach(function (id) {
        var button = byId(id);
        button.setAttribute('aria-disabled', String(!complete));
        button.title = complete ? '' : 'Fill in the required fields (*) first';
      });

      // AI assist unlocks under the same rule: every required field is filled in
      var aiAssist = byId('ai-assist');
      aiAssist.setAttribute('aria-disabled', String(!complete || aiUnavailable));
      if (aiUnavailable) { aiAssist.title = 'AI assist isn\u2019t available in this view'; }
      else { aiAssist.title = complete ? 'Scan this page and suggest improvements' : 'Fill in the required fields (*) first'; }
    }

    // Returns the list of missing required items (empty when the draft can be saved)
    function validateRequired() {
      document.querySelectorAll('.has-error').forEach(function (block) { clearBlockError(block); });
      var missing = [];

      REQUIRED_FIELDS.forEach(function (field) {
        if (readText(field.el) === '') {
          flagBlock(field.el.closest('.text-block'), field.message);
          missing.push({ label: field.label, target: field.el });
        }
      });

      var steps = stepBlocks();
      if (!steps.length) {
        addStep('', '');
        steps = stepBlocks();
      }
      var hasStepTitle = steps.some(function (block) {
        return readText(block.querySelector('.step-title')) !== '';
      });
      if (!hasStepTitle) {
        var firstTitle = steps[0].querySelector('.step-title');
        flagBlock(steps[0], 'Add at least one step with a title to save a draft.', firstTitle.parentNode);
        missing.push({ label: 'at least one step', target: firstTitle });
      }

      return missing;
    }

    // Adds a block (before beforeNode, or at the end when null) and puts the cursor in it
    function insertBlockAndFocus(type, beforeNode, level, inserterTypes) {
      var block = addBlock(type, { level: level }, beforeNode, inserterTypes);
      markDirty();
      block.querySelector('[contenteditable]').focus();
    }

    /* ---------- On this page (outline) ---------- */
    function refreshOutline() {
      var title = readText(titleEl);
      var outlineTitle = byId('outline-title');
      outlineTitle.textContent = title || 'Untitled page';
      outlineTitle.classList.toggle('is-empty', !title);

      var steps = readSteps();
      var list = byId('outline-list');
      list.textContent = '';
      var allText = [title, readText(subtitleEl), readText(summaryEl)];
      var warningCount = 0;
      readBlocks().forEach(function (block) {
        var item = document.createElement('li');
        if (block.type === 'step') {
          item.textContent = block.number + '. ' + (block.title || 'Untitled step');
          allText.push(block.title, block.text);
        } else if (block.type === 'header') {
          item.textContent = block.text || 'Untitled header';
          item.className = 'outline-header';
          item.style.marginLeft = ((block.level || 2) - 1) * 8 + 'px';
          allText.push(block.text);
        } else {
          allText.push(block.text);
          if (block.type === 'warning') { warningCount += 1; }
          return;
        }
        list.appendChild(item);
      });

      if (warningCount) {
        var warningItem = document.createElement('li');
        warningItem.innerHTML = WARNING_ICON;
        warningItem.appendChild(document.createTextNode(warningCount + (warningCount === 1 ? ' warning' : ' warnings')));
        list.appendChild(warningItem);
      }
      var wordCount = allText.join(' ').split(/\s+/).filter(Boolean).length;
      var minutes = Math.max(1, Math.round(wordCount / 200));

      byId('outline-meta').textContent = steps.length
        ? '~' + minutes + ' min read \u00b7 ' + steps.length + (steps.length === 1 ? ' step' : ' steps')
        : 'No steps yet';

      updateSaveState();
      ensureSectionAiButtons();
    }

    /* ---------- Page Setup: page type ---------- */
    function renderPageType() {
      var select = byId('page-type');
      select.textContent = '';
      addOption(select, '', 'Select a page type');
      state.pageTypes.forEach(function (type) { addOption(select, type, type); });
      select.value = state.pageType;
    }

    /* ---------- Page Setup: where this lives (chips) ---------- */
    function renderChips() {
      var box = byId('chips');
      box.textContent = '';

      state.locations.forEach(function (location) {
        var chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip';
        chip.textContent = location.name;
        chip.setAttribute('aria-pressed', String(location.on));
        chip.addEventListener('click', function () {
          location.on = !location.on;
          chip.setAttribute('aria-pressed', String(location.on));
          markDirty();
        });
        box.appendChild(chip);
      });

      var add = document.createElement('button');
      add.type = 'button';
      add.className = 'chip-add';
      add.textContent = '+ Add';
      add.addEventListener('click', function () { showChipInput(box, add); });
      box.appendChild(add);
    }

    function showChipInput(box, addButton) {
      var input = document.createElement('input');
      input.type = 'text';
      input.className = 'chip-input';
      input.placeholder = 'Name, then Enter';
      input.setAttribute('aria-label', 'Add a location');
      box.replaceChild(input, addButton);
      input.focus();

      var finished = false;
      function finish(commit) {
        if (finished) { return; }
        finished = true;
        var name = input.value.trim();
        if (commit && name) { addLocation(name); } else { renderChips(); }
      }

      input.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') { event.preventDefault(); finish(true); }
        if (event.key === 'Escape') { finish(false); }
      });
      input.addEventListener('blur', function () { finish(true); });
    }

    function addLocation(name) {
      var existing = state.locations.filter(function (location) {
        return location.name.toLowerCase() === name.toLowerCase();
      })[0];
      if (existing) { existing.on = true; } else { state.locations.push({ name: name, on: true }); }
      renderChips();
      markDirty();
    }

    /* ---------- Page Setup: linked team members + reviewer ---------- */
    function renderMembers() {
      var box = byId('members');
      box.textContent = '';

      state.members.forEach(function (name, index) {
        var avatar = document.createElement('span');
        avatar.className = 'avatar ' + (index === 0 ? 'avatar-blue' : 'avatar-grey');
        avatar.title = name;
        avatar.textContent = initials(name);
        box.appendChild(avatar);
      });

      var add = document.createElement('button');
      add.type = 'button';
      add.className = 'avatar avatar-add';
      add.setAttribute('aria-label', 'Link a team member');
      add.textContent = '+';
      add.addEventListener('click', function () {
        var input = byId('member-input');
        input.hidden = false;
        input.focus();
      });
      box.appendChild(add);
    }

    function closeMemberInput() {
      var input = byId('member-input');
      input.value = '';
      input.hidden = true;
    }

    function renderReviewer() {
      var select = byId('reviewer');
      if (state.reviewer && state.members.indexOf(state.reviewer) < 0) { state.reviewer = ''; }

      select.textContent = '';
      addOption(select, '', 'No reviewer');
      state.members.forEach(function (name) { addOption(select, name, name); });
      select.value = state.reviewer;

      var avatar = byId('reviewer-avatar');
      var index = state.members.indexOf(state.reviewer);
      avatar.hidden = index < 0;
      avatar.textContent = index < 0 ? '' : initials(state.reviewer);
      avatar.className = 'avatar avatar-small ' + (index === 0 ? 'avatar-blue' : 'avatar-grey');
    }

    /* ---------- Page Setup: visibility ---------- */
    function renderVisibility() {
      document.querySelectorAll('.segment').forEach(function (segment) {
        segment.setAttribute('aria-pressed', String(segment.getAttribute('data-value') === state.visibility));
      });
    }

    function renderSidebar() {
      renderPageType();
      renderChips();
      renderMembers();
      renderReviewer();
      renderVisibility();
    }

    /* ---------- Export: editor state -> plain text ---------- */
    function escapeLine(line) {
      var first = line.charAt(0);
      return (first === '[' || first === ESCAPE) ? ESCAPE + line : line;
    }

    function unescapeLine(line) {
      return line.charAt(0) === ESCAPE ? line.slice(1) : line;
    }

    function serializeDraft() {
      var out = [];

      function section(name, lines) {
        out.push('[' + name + ']');
        lines.forEach(function (line) { out.push(escapeLine(line)); });
        out.push('');
      }

      function textLines(value) { return value ? value.split(NL) : []; }

      out.push('PAGE EDITOR DRAFT');
      out.push('FORMAT: ' + FORMAT_VERSION);
      out.push('SAVED: ' + new Date().toISOString());
      out.push('Open this file with "Open draft" in the page editor to fill in every section.');
      out.push('');

      section('TITLE', textLines(readText(titleEl)));
      section('SUBTITLE', textLines(readText(subtitleEl)));
      section('SUMMARY', textLines(readText(summaryEl)));

      readBlocks().forEach(function (block, index) {
        var prefix = 'BLOCK ' + (index + 1) + ' ';
        if (block.type === 'step') {
          section(prefix + 'STEP NUMBER', [String(block.number)]);
          section(prefix + 'STEP TITLE', textLines(block.title));
          section(prefix + 'STEP TEXT', textLines(block.text));
        } else if (block.type === 'header') {
          section(prefix + 'HEADER ' + block.level, textLines(block.text));
        } else {
          section(prefix + block.type.toUpperCase(), textLines(block.text));
        }
      });

      // Remember how many blocks sit above the "+ Add a block" button so the layout reopens the same way
      var addButton = byId('add-block');
      var aboveButton = contentBlocks().filter(function (block) {
        return block.compareDocumentPosition(addButton) & Node.DOCUMENT_POSITION_FOLLOWING;
      }).length;
      section('ADD BLOCK BUTTON', [String(aboveButton)]);
      section('KEYWORDS', state.keywords);

      section('PAGE TYPE', textLines(state.pageType));
      section('WHERE THIS LIVES', state.locations.filter(function (l) { return l.on; }).map(function (l) { return l.name; }));
      section('LINKED TEAM MEMBERS', state.members);
      section('REVIEWER', textLines(state.reviewer));
      section('VISIBILITY', textLines(state.visibility));

      return out.join(NL);
    }

    function draftFilename() {
      var slug = readText(titleEl).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
      return (slug || 'untitled-page') + '-draft.txt';
    }

    /* ---------- Import: plain text -> editor state ---------- */
    function parseDraft(text) {
      var sections = {};
      var current = null;
      text.replace(/\r\n?/g, NL).split(NL).forEach(function (line) {
        var header = /^\[([A-Z0-9 ]+)\]$/.exec(line);
        if (header) {
          current = header[1];
          sections[current] = [];
        } else if (current !== null) {
          sections[current].push(unescapeLine(line));
        }
      });
      return sections;
    }

    function looksLikeDraft(sections) {
      return Object.keys(sections).some(function (name) {
        return KNOWN_SECTIONS.indexOf(name) >= 0 || /^BLOCK \d+ /.test(name) || /^STEP \d+ (TITLE|TEXT)$/.test(name);
      });
    }

    // Turns the BLOCK n ... sections (or the older STEP n ... sections) into an ordered list of blocks
    function readDraftBlocks(sections, body) {
      var blocks = [];
      var numbers = {};
      Object.keys(sections).forEach(function (name) {
        var match = /^BLOCK (\d+) (PARAGRAPH|HEADER [1-5]|HEADER|NOTE|WARNING|STEP TITLE|STEP TEXT|STEP NUMBER)$/.exec(name);
        if (match) { numbers[Number(match[1])] = true; }
      });

      var ordered = Object.keys(numbers).map(Number).sort(function (a, b) { return a - b; });
      ordered.forEach(function (n) {
        var prefix = 'BLOCK ' + n + ' ';
        var headerLevel = [1, 2, 3, 4, 5].filter(function (level) {
          return sections[prefix + 'HEADER ' + level];
        })[0];
